<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowScript — MicroPython Visual IDE</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Syne:wght@400;500;600;700;800&display=swap');
  :root {
    --bg:#0d0f14;--surface:#13161d;--surface2:#1a1e28;--surface3:#222736;
    --border:#2a3045;--border2:#3a4560;
    --accent:#4af0b0;--accent2:#5b8fff;--accent3:#ff6b6b;--accent4:#ffc85a;--accent5:#c97bff;
    --text:#e8eaf0;--text2:#8892aa;--text3:#5a6478;
    --tab-h:42px;--left-w:220px;--right-w:240px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:12px;height:100vh;overflow:hidden;display:flex;flex-direction:column}
  /* TOPBAR */
  #topbar{height:var(--tab-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:stretch;flex-shrink:0;overflow-x:auto;overflow-y:hidden}
  #topbar::-webkit-scrollbar{height:3px}
  #topbar::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
  .tab{display:flex;align-items:center;gap:6px;padding:0 14px;cursor:pointer;border-right:1px solid var(--border);white-space:nowrap;color:var(--text2);font-family:'Syne',sans-serif;font-size:12px;font-weight:500;transition:background .15s,color .15s;position:relative;min-width:80px}
  .tab:hover{background:var(--surface2);color:var(--text)}
  .tab.active{background:var(--surface2);color:var(--accent)}
  .tab.active::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--accent)}
  .tab .tab-close{margin-left:4px;opacity:0;font-size:14px;line-height:1;color:var(--text3);transition:opacity .1s,color .1s}
  .tab:hover .tab-close{opacity:1}
  .tab .tab-close:hover{color:var(--accent3)}
  #btn-new-tab{display:flex;align-items:center;justify-content:center;padding:0 14px;cursor:pointer;color:var(--text3);font-size:18px;transition:color .15s,background .15s;border-right:1px solid var(--border)}
  #btn-new-tab:hover{color:var(--accent);background:var(--surface2)}
  #topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px;padding:0 12px;border-left:1px solid var(--border)}
  .top-btn{padding:4px 12px;border-radius:4px;border:1px solid var(--border2);background:transparent;color:var(--text2);font-family:'JetBrains Mono',monospace;font-size:11px;cursor:pointer;transition:all .15s}
  .top-btn:hover{border-color:var(--accent);color:var(--accent)}
  .top-btn.primary{border-color:var(--accent);color:var(--accent)}
  .top-btn.primary:hover{background:var(--accent);color:var(--bg)}
  /* MAIN */
  #main{flex:1;display:flex;overflow:hidden}
  /* PALETTE */
  #palette{width:var(--left-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
  #palette-header{padding:10px 12px 8px;font-family:'Syne',sans-serif;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);border-bottom:1px solid var(--border)}
  #palette-scroll{flex:1;overflow-y:auto;padding:8px}
  #palette-scroll::-webkit-scrollbar{width:4px}
  #palette-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
  .palette-group{margin-bottom:10px}
  .palette-group-title{font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);padding:4px 4px 6px;font-family:'Syne',sans-serif}
  .palette-block{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);margin-bottom:4px;cursor:grab;transition:border-color .15s,background .15s,transform .1s;user-select:none}
  .palette-block:hover{border-color:var(--border2);background:var(--surface3);transform:translateX(2px)}
  .palette-block:active{cursor:grabbing}
  .palette-block .pb-color{width:8px;height:28px;border-radius:3px;flex-shrink:0}
  .palette-block .pb-info{flex:1;min-width:0}
  .palette-block .pb-name{font-size:11px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .palette-block .pb-desc{font-size:9px;color:var(--text3);margin-top:1px}
  /* CANVAS */
  #canvas-wrap{flex:1;position:relative;overflow:hidden;background:var(--bg);background-image:radial-gradient(circle at 1px 1px,var(--border) 1px,transparent 0);background-size:24px 24px}
  #main-canvas{position:absolute;top:0;left:0;cursor:default}
  #canvas-tools{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:4px;z-index:10}
  .ctool{width:28px;height:28px;border-radius:5px;border:none;background:transparent;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .15s}
  .ctool:hover{background:var(--surface2);color:var(--text)}
  .ctool.active{background:var(--surface3);color:var(--accent)}
  /* SIDEBAR */
  #sidebar{width:var(--right-w);background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
  #sidebar-header{padding:10px 12px 8px;font-family:'Syne',sans-serif;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
  #sidebar-scroll{flex:1;overflow-y:auto;padding:8px}
  #sidebar-scroll::-webkit-scrollbar{width:4px}
  #sidebar-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
  .var-section-title{font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);padding:4px 4px 6px;font-family:'Syne',sans-serif;display:flex;align-items:center;justify-content:space-between}
  .var-item{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);margin-bottom:4px;cursor:grab;transition:border-color .15s;position:relative}
  .var-item:hover{border-color:var(--border2)}
  .var-item:active{cursor:grabbing}
  .var-item .drag-handle{color:var(--text3);font-size:10px;cursor:grab;flex-shrink:0}
  .var-item input{background:transparent;border:none;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:11px;width:100%;outline:none;min-width:0}
  .var-item input::placeholder{color:var(--text3)}
  .var-item input:focus{color:var(--accent)}
  .var-item .var-del{color:var(--text3);cursor:pointer;font-size:13px;flex-shrink:0;transition:color .1s;opacity:0}
  .var-item:hover .var-del{opacity:1}
  .var-item .var-del:hover{color:var(--accent3)}
  .add-var-btn{width:100%;padding:6px;border-radius:6px;border:1px dashed var(--border2);background:transparent;color:var(--text3);font-family:'JetBrains Mono',monospace;font-size:11px;cursor:pointer;transition:all .15s;margin-top:2px}
  .add-var-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(74,240,176,.04)}
  .sidebar-divider{height:1px;background:var(--border);margin:10px 0}
  /* MODALS */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
  .modal-overlay.show{opacity:1;pointer-events:all}
  .modal{background:var(--surface);border:1px solid var(--border2);border-radius:12px;padding:24px;min-width:360px;max-width:90vw;transform:translateY(10px);transition:transform .2s}
  .modal-overlay.show .modal{transform:none}
  .modal h2{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;color:var(--text);margin-bottom:16px}
  .modal label{display:block;font-size:10px;color:var(--text3);margin-bottom:4px;margin-top:12px;text-transform:uppercase;letter-spacing:.08em}
  .modal input,.modal textarea{width:100%;padding:8px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:12px;outline:none;transition:border-color .15s}
  .modal input:focus,.modal textarea:focus{border-color:var(--accent2)}
  .modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
  .modal-btn{padding:8px 18px;border-radius:6px;border:1px solid var(--border2);background:transparent;color:var(--text2);font-family:'JetBrains Mono',monospace;font-size:12px;cursor:pointer;transition:all .15s}
  .modal-btn:hover{background:var(--surface2);color:var(--text)}
  .modal-btn.ok{border-color:var(--accent);color:var(--accent)}
  .modal-btn.ok:hover{background:var(--accent);color:var(--bg)}
  #code-out{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:12px;font-size:11px;color:var(--accent);overflow-y:auto;max-height:50vh;white-space:pre;font-family:'JetBrains Mono',monospace;line-height:1.6}
  /* CTX MENU */
  #ctx-menu{position:fixed;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:4px;z-index:60;min-width:150px;display:none;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .ctx-item{padding:7px 12px;border-radius:4px;cursor:pointer;font-size:11px;color:var(--text2);transition:background .1s,color .1s;display:flex;align-items:center;gap:8px}
  .ctx-item:hover{background:var(--surface3);color:var(--text)}
  .ctx-item.danger:hover{background:rgba(255,107,107,.1);color:var(--accent3)}
  .ctx-divider{height:1px;background:var(--border);margin:3px 0}
  ::-webkit-scrollbar{width:5px;height:5px}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>
<div id="topbar">
  <div id="btn-new-tab" title="New Function">+</div>
  <div id="topbar-right">
    <button class="top-btn" id="btn-load-lib">📂 Load lib.py</button>
    <button class="top-btn" id="btn-load-init">📂 Load init.py</button>
    <div style="width:1px;background:var(--border);margin:6px 2px"></div>
    <button class="top-btn" id="btn-save-chart">💾 Save Chart</button>
    <button class="top-btn" id="btn-load-chart">📂 Load Chart</button>
    <button class="top-btn primary" id="btn-generate">▶ Generate Code</button>
  </div>
</div>
<div id="main">
  <div id="palette">
    <div id="palette-header">Blocks</div>
    <div id="palette-scroll"></div>
  </div>
  <div id="canvas-wrap">
    <div id="canvas-tools">
      <button class="ctool active" id="tool-select" title="Select">↖</button>
      <button class="ctool" id="tool-pan" title="Pan">✥</button>
      <button class="ctool" id="tool-del" title="Delete (Del)">🗑</button>
      <div style="width:1px;background:var(--border);margin:3px 2px"></div>
      <button class="ctool" id="tool-zoom-in" title="Zoom in">+</button>
      <button class="ctool" id="tool-zoom-out" title="Zoom out">−</button>
      <button class="ctool" id="tool-fit" title="Fit">⊡</button>
    </div>
    <canvas id="main-canvas"></canvas>
  </div>
  <div id="sidebar">
    <div id="sidebar-header"><span>Variables</span></div>
    <div id="sidebar-scroll">
      <div id="global-vars-section">
        <div class="var-section-title">Global</div>
        <div id="global-var-list"></div>
        <button class="add-var-btn" id="btn-add-global">+ Add Global</button>
      </div>
      <div id="fn-vars-section" style="display:none">
        <div class="sidebar-divider"></div>
        <div class="var-section-title">Local</div>
        <div id="local-var-list"></div>
        <button class="add-var-btn" id="btn-add-local">+ Add Local</button>
        <div class="sidebar-divider"></div>
        <div class="var-section-title">Parameters</div>
        <div id="param-list"></div>
        <button class="add-var-btn" id="btn-add-param">+ Add Parameter</button>
        <div class="sidebar-divider"></div>
        <div class="var-section-title">Return Values</div>
        <div id="return-list"></div>
        <button class="add-var-btn" id="btn-add-return">+ Add Return</button>
      </div>
    </div>
  </div>
</div>

<!-- CTX MENU -->
<div id="ctx-menu">
  <div class="ctx-item" id="ctx-edit">✏️ Edit Block</div>
  <div class="ctx-item" id="ctx-dup">⧉ Duplicate</div>
  <div class="ctx-divider"></div>
  <div class="ctx-item danger" id="ctx-del">🗑 Delete</div>
</div>

<!-- NEW FUNCTION MODAL -->
<div class="modal-overlay" id="fn-modal">
  <div class="modal">
    <h2>New Function</h2>
    <label>Function Name</label>
    <input type="text" id="fn-name-input" placeholder="my_function">
    <div class="modal-btns">
      <button class="modal-btn" id="fn-cancel">Cancel</button>
      <button class="modal-btn ok" id="fn-ok">Create</button>
    </div>
  </div>
</div>

<!-- EDIT BLOCK MODAL -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <h2 id="edit-modal-title">Edit Block</h2>
    <div id="edit-modal-body"></div>
    <div class="modal-btns">
      <button class="modal-btn" id="edit-cancel">Cancel</button>
      <button class="modal-btn ok" id="edit-ok">Apply</button>
    </div>
  </div>
</div>

<!-- CODE OUTPUT MODAL -->
<div class="modal-overlay" id="code-modal">
  <div class="modal" style="min-width:620px;max-height:80vh;display:flex;flex-direction:column">
    <h2>Generated MicroPython</h2>
    <pre id="code-out"></pre>
    <div class="modal-btns">
      <button class="modal-btn" id="btn-copy-code">📋 Copy</button>
      <button class="modal-btn" id="btn-dl-code">💾 Download</button>
      <button class="modal-btn ok" id="code-close">Close</button>
    </div>
  </div>
</div>

<input type="file" id="file-input" style="display:none" accept=".py">
<input type="file" id="chart-input" style="display:none" accept=".flowscript,.json">

<script>
'use strict';

/* ══════════════════════════════════════
   STATE
══════════════════════════════════════ */
const state = {
  tabs: [{ id:0, name:'main', isMain:true, blocks:[], connections:[], localVars:[], params:[], returns:[] }],
  activeTab: 0,
  nextTabId: 1,
  globalVars: [],
  initCode: '',
  libCode: '',
  libBlocks: [],
  canvasState: { 0:{ offsetX:0, offsetY:0, scale:1 } },
  dragging: null,
  connecting: null,
  connectingMouse: null,
  selected: null,
  tool: 'select',
  pan: { active:false },
  nextBlockId: 1,
  nextVarId: 1,
  ctxTarget: null,
};

/* ══════════════════════════════════════
   BLOCK DEFINITIONS
   
   Block geometry system:
   - Flow ports: circles on top (flowIn) and bottom (flowOut / flowExtra_N)
   - Data IN ports: squares on the LEFT EDGE, evenly spaced vertically
   - Data OUT ports: squares on the RIGHT EDGE, evenly spaced vertically
   
   Compact blocks (value/data/op): BH = 36px, BW = 140px
   Normal blocks: BH = 46 + fields*18 + extraFlows*18
══════════════════════════════════════ */

// Block width constants
const BW_NORMAL  = 170;  // flow/control/misc/func blocks
const BW_COMPACT = 80;   // value, op, data blocks — intentionally narrow
const BH_NORMAL  = 46;
const BH_COMPACT = 32;
const PORT_R     = 6;
const FLOW_R     = 7;
const PORT_SPACING = 18; // px between data ports vertically
const PORT_MARGIN  = 10; // px from top/bottom before first port

// Operator symbol map  (key → [symbol, display like "a OP b"])
const OP_SYMS = {
  op_add:'+', op_sub:'−', op_mul:'×', op_div:'÷', op_mod:'%',
  op_eq:'==', op_neq:'!=', op_lt:'<', op_gt:'>', op_and:'and', op_or:'or', op_not:'not'
};

const BLOCK_DEFS = {
  // FLOW
  start:      { label:'START',   color:'#4af0b0', cat:'flow',    compact:false, flowIn:false, flowOut:true,  extraFlows:[], ports:{in:[],out:[]}, fields:[] },
  end_main:   { label:'END',     color:'#4af0b0', cat:'flow',    compact:false, flowIn:true,  flowOut:false, extraFlows:[], ports:{in:[],out:[]}, fields:[] },
  comment:    { label:'Comment', color:'#5a6478', cat:'flow',    compact:false, flowIn:false, flowOut:false, extraFlows:[], ports:{in:[],out:[]}, fields:[{k:'text',label:'Text',default:'comment'}] },
  // CONTROL
  if_block:   { label:'IF',      color:'#ffc85a', cat:'control', compact:false, flowIn:true,  flowOut:true,  extraFlows:['false'], ports:{in:[{l:'cond'}],out:[]}, fields:[] },
  for_loop:   { label:'FOR',     color:'#ffc85a', cat:'control', compact:false, flowIn:true,  flowOut:true,  extraFlows:['exit'],  ports:{in:[{l:'iter'}],out:[]}, fields:[{k:'var',label:'Var',default:'i'}] },
  while_loop: { label:'WHILE',   color:'#ffc85a', cat:'control', compact:false, flowIn:true,  flowOut:true,  extraFlows:['exit'],  ports:{in:[{l:'cond'}],out:[]}, fields:[] },
  break_blk:  { label:'BREAK',   color:'#ff6b6b', cat:'control', compact:false, flowIn:true,  flowOut:false, extraFlows:[], ports:{in:[],out:[]}, fields:[] },
  // VALUES — compact, no flow, just data nodes
  read_var:   { label:'Read',    color:'#c97bff', cat:'value',   compact:true,  flowIn:false, flowOut:false, extraFlows:[], ports:{in:[],out:[{l:'val'}]}, fields:[{k:'name',label:'Var',default:'x'}] },
  set_var:    { label:'Set',     color:'#c97bff', cat:'value',   compact:false, flowIn:true,  flowOut:true,  extraFlows:[], ports:{in:[{l:'val'}],out:[]}, fields:[{k:'name',label:'Var',default:'x'}] },
  data_blk:   { label:'Data',    color:'#c97bff', cat:'value',   compact:true,  flowIn:false, flowOut:false, extraFlows:[], ports:{in:[],out:[{l:'val'}]}, fields:[{k:'value',label:'Val',default:'0'}] },
  // OPERATORS — compact, no flow; a/b are editable literal fallbacks
  op_add:     { label:'+',       color:'#5b8fff', cat:'op', compact:true, flowIn:false,flowOut:false,extraFlows:[],ports:{in:[{l:'a'},{l:'b'}],out:[{l:'res'}]},fields:[{k:'a',label:'a',default:'_'},{k:'b',label:'b',default:'_'}] },
  op_sub:     { label:'−',       color:'#5b8fff', cat:'op', compact:true, flowIn:false,flowOut:false,extraFlows:[],ports:{in:[{l:'a'},{l:'b'}],out:[{l:'res'}]},fields:[{k:'a',label:'a',default:'_'},{k:'b',label:'b',default:'_'}] },
  op_mul:     { label:'×',       color:'#5b8fff', cat:'op', compact:true, flowIn:false,flowOut:false,extraFlows:[],ports:{in:[{l:'a'},{l:'b'}],out:[{l:'res'}]},fields:[{k:'a',label:'a',default:'_'},{k:'b',label:'b',default:'_'}] },
  op_div:     { label:'÷',       color:'#5b8fff', cat:'op', compact:true, flowIn:false,flowOut:false,extraFlows:[],ports:{in:[{l:'a'},{l:'b'}],out:[{l:'res'}]},fields:[{k:'a',label:'a',default:'_'},{k:'b',label:'b',default:'_'}] },
  op_mod:     { label:'%',       color:'#5b8fff', cat:'op', compact:true, flowIn:false,flowOut:false,extraFlows:[],ports:{in:[{l:'a'},{l:'b'}],out:[{l:'res'}]},fields:[{k:'a',label:'a',default:'_'},{k:'b',label:'b',default:'_'}] },
  op_eq:      { label:'==',      color:'#5b8fff', cat:'op', compact:true, flowIn:false,flowOut:false,extraFlows:[],ports:{in:[{l:'a'},{l:'b'}],out:[{l:'res'}]},fields:[{k:'a',label:'a',default:'_'},{k:'b',label:'b',default:'_'}] },
  op_neq:     { label:'!=',      color:'#5b8fff', cat:'op', compact:true, flowIn:false,flowOut:false,extraFlows:[],ports:{in:[{l:'a'},{l:'b'}],out:[{l:'res'}]},fields:[{k:'a',label:'a',default:'_'},{k:'b',label:'b',default:'_'}] },
  op_lt:      { label:'<',       color:'#5b8fff', cat:'op', compact:true, flowIn:false,flowOut:false,extraFlows:[],ports:{in:[{l:'a'},{l:'b'}],out:[{l:'res'}]},fields:[{k:'a',label:'a',default:'_'},{k:'b',label:'b',default:'_'}] },
  op_gt:      { label:'>',       color:'#5b8fff', cat:'op', compact:true, flowIn:false,flowOut:false,extraFlows:[],ports:{in:[{l:'a'},{l:'b'}],out:[{l:'res'}]},fields:[{k:'a',label:'a',default:'_'},{k:'b',label:'b',default:'_'}] },
  op_and:     { label:'and',     color:'#5b8fff', cat:'op', compact:true, flowIn:false,flowOut:false,extraFlows:[],ports:{in:[{l:'a'},{l:'b'}],out:[{l:'res'}]},fields:[{k:'a',label:'a',default:'_'},{k:'b',label:'b',default:'_'}] },
  op_or:      { label:'or',      color:'#5b8fff', cat:'op', compact:true, flowIn:false,flowOut:false,extraFlows:[],ports:{in:[{l:'a'},{l:'b'}],out:[{l:'res'}]},fields:[{k:'a',label:'a',default:'_'},{k:'b',label:'b',default:'_'}] },
  op_not:     { label:'not',     color:'#5b8fff', cat:'op', compact:true, flowIn:false,flowOut:false,extraFlows:[],ports:{in:[{l:'a'}],out:[{l:'res'}]},fields:[{k:'a',label:'a',default:'_'}] },
  // MISC
  delay:      { label:'Delay',   color:'#ff9f43', cat:'misc',    compact:false, flowIn:true,  flowOut:true,  extraFlows:[], ports:{in:[{l:'ms'}],out:[]}, fields:[{k:'ms',label:'ms',default:'1000'}] },
  print_blk:  { label:'Print',   color:'#ff9f43', cat:'misc',    compact:false, flowIn:true,  flowOut:true,  extraFlows:[], ports:{in:[{l:'val'}],out:[]}, fields:[] },
  ret_block:  { label:'Return',  color:'#ff6b6b', cat:'func',    compact:false, flowIn:true,  flowOut:false, extraFlows:[], ports:{in:[],out:[]}, fields:[] },
};

const PALETTE_GROUPS = [
  { title:'Flow',     types:['start','end_main','comment'] },
  { title:'Control',  types:['if_block','for_loop','while_loop','break_blk'] },
  { title:'Values',   types:['read_var','set_var','data_blk'] },
  { title:'Operators',types:['op_add','op_sub','op_mul','op_div','op_mod','op_eq','op_neq','op_lt','op_gt','op_and','op_or','op_not'] },
  { title:'Misc',     types:['delay','print_blk'] },
  { title:'Functions',types:['ret_block'] },
];

/* ══════════════════════════════════════
   CANVAS SETUP
══════════════════════════════════════ */
const canvas = document.getElementById('main-canvas');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('canvas-wrap');

function resize() { canvas.width = wrap.clientWidth; canvas.height = wrap.clientHeight; draw(); }
window.addEventListener('resize', resize);

function getCS() {
  if (!state.canvasState[state.activeTab])
    state.canvasState[state.activeTab] = { offsetX:0, offsetY:0, scale:1 };
  return state.canvasState[state.activeTab];
}
function toWorld(sx,sy) { const c=getCS(); return { x:(sx-c.offsetX)/c.scale, y:(sy-c.offsetY)/c.scale }; }

function activeTab()   { return state.tabs.find(t=>t.id===state.activeTab); }
function activeBlocks(){ return activeTab()?.blocks||[]; }
function activeConns() { return activeTab()?.connections||[]; }

/* ══════════════════════════════════════
   BLOCK GEOMETRY
   
   Key insight: data ports sit exactly on the left/right EDGES of the block.
   Their Y position is computed from the content area only (between flow ports).
══════════════════════════════════════ */
function getBlockDef(type) {
  return BLOCK_DEFS[type]
    || state.libBlocks.find(lb=>lb.type===type)
    || { label:type, color:'#888', cat:'lib', compact:false, flowIn:true, flowOut:true, extraFlows:[], ports:{in:[],out:[]}, fields:[] };
}

function blockSize(b) {
  const def = getBlockDef(b.type);
  const bw = def.compact ? BW_COMPACT : BW_NORMAL;
  let bh;
  if (def.compact) {
    // compact: just tall enough for the data ports
    const maxPorts = Math.max((def.ports.in||[]).length, (def.ports.out||[]).length, 1);
    bh = Math.max(BH_COMPACT, PORT_MARGIN*2 + maxPorts * PORT_SPACING);
  } else {
    bh = BH_NORMAL + (def.fields||[]).length * 18 + (def.extraFlows||[]).length * 18;
    // also needs to fit data ports
    const maxPorts = Math.max((def.ports.in||[]).length, (def.ports.out||[]).length, 0);
    if (maxPorts > 0) bh = Math.max(bh, PORT_MARGIN*2 + maxPorts * PORT_SPACING + (def.flowIn?14:0) + (def.flowOut?14:0));
  }
  return { bw, bh };
}

/**
 * Returns the canvas-space position of a port.
 *
 * Port layout:
 *  flowIn  → top center of block
 *  flowOut → bottom center
 *  flowExtra_N → bottom center offset right by (N+1)*24
 *  dataIn_i  → LEFT edge, Y spread evenly through content zone
 *  dataOut_i → RIGHT edge, Y spread evenly through content zone
 *
 * The "content zone" for data ports is the full block height minus
 * the flow-port exclusion zones (14px at top if flowIn, 14px at bottom if flowOut).
 */
function getPortPos(block, portType, idx) {
  const def = getBlockDef(block.type);
  const { bw, bh } = blockSize(block);

  if (portType === 'flowIn')  return { x: block.x + bw/2, y: block.y };
  if (portType === 'flowOut') return { x: block.x + bw/2, y: block.y + bh };
  if (portType.startsWith('flowExtra_')) {
    const ei = parseInt(portType.split('_')[1]);
    return { x: block.x + bw/2 + (ei+1)*26, y: block.y + bh };
  }

  // Data ports — Y spread in content zone
  const topExclude    = (def.flowIn  !== false) ? 14 : 4;
  const bottomExclude = (def.flowOut !== false) ? 14 : 4;
  const contentH = bh - topExclude - bottomExclude;

  if (portType === 'dataIn') {
    const total = (def.ports?.in||[]).length;
    const spacing = total > 1 ? contentH / (total+1) : contentH/2;
    const y = block.y + topExclude + spacing * (idx+1);
    return { x: block.x, y };
  }
  if (portType === 'dataOut') {
    const total = (def.ports?.out||[]).length;
    const spacing = total > 1 ? contentH / (total+1) : contentH/2;
    const y = block.y + topExclude + spacing * (idx+1);
    return { x: block.x + bw, y };
  }
  return { x: block.x, y: block.y };
}

/* ══════════════════════════════════════
   DRAW
══════════════════════════════════════ */
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const cs = getCS();
  ctx.save();
  ctx.translate(cs.offsetX, cs.offsetY);
  ctx.scale(cs.scale, cs.scale);

  for (const conn of activeConns()) drawConnection(conn);

  if (state.connecting && state.connectingMouse) {
    const p = getPortPos(state.connecting.block, state.connecting.portType, state.connecting.idx||0);
    const m = state.connectingMouse;
    drawBezier(p.x, p.y, m.x, m.y, state.connecting.isFlow ? '#5b8fff99' : '#c97bff99', 1.5);
  }

  for (const block of activeBlocks()) drawBlock(block);
  ctx.restore();
}

function drawBlock(block) {
  const def = getBlockDef(block.type);
  const { bw, bh } = blockSize(block);
  const sel = state.selected?.id === block.id;

  // Shadow + body
  ctx.shadowColor = sel ? def.color+'50' : 'rgba(0,0,0,0.45)';
  ctx.shadowBlur  = sel ? 16 : 7;
  ctx.shadowOffsetY = 2;
  roundRect(ctx, block.x, block.y, bw, bh, 7);
  ctx.fillStyle = '#1a1e28';
  ctx.fill();
  ctx.strokeStyle = sel ? def.color : '#2a3045';
  ctx.lineWidth = sel ? 2 : 1;
  ctx.stroke();
  ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

  // Left color bar
  roundRectLeft(ctx, block.x, block.y, 5, bh, 7);
  ctx.fillStyle = def.color;
  ctx.fill();

  // Label  ── operators show "a OP b" or "not a"
  ctx.textBaseline = 'middle';
  if (def.cat === 'op') {
    const sym = OP_SYMS[block.type] || def.label;
    const va = block.data?.a || 'a';
    const vb = block.data?.b || 'b';
    const displayLabel = block.type === 'op_not' ? `not ${va}` : `${va} ${sym} ${vb}`;
    ctx.fillStyle = def.color;
    ctx.font = `600 11px 'JetBrains Mono', monospace`;
    ctx.fillText(displayLabel, block.x + 10, block.y + bh/2);
  } else {
    ctx.fillStyle = def.color;
    ctx.font = `600 11px 'Syne', sans-serif`;
    ctx.fillText(def.label, block.x + 12, block.y + 15);

    // Fields
    let fy = block.y + 30;
    for (const field of (def.fields||[])) {
      const val = block.data?.[field.k] ?? field.default ?? '';
      ctx.fillStyle = '#5a6478';
      ctx.font = '9px JetBrains Mono';
      ctx.fillText(field.label+':', block.x + 12, fy);
      ctx.fillStyle = '#e8eaf0';
      ctx.font = '10px JetBrains Mono';
      ctx.fillText(String(val).substring(0,16), block.x + 44, fy);
      fy += 18;
    }
  }

  // Flow ports
  if (def.flowIn  !== false) drawFlowPort(...pxy(getPortPos(block,'flowIn',0)),  def.color);
  if (def.flowOut !== false) drawFlowPort(...pxy(getPortPos(block,'flowOut',0)), def.color);
  if (def.extraFlows) {
    for (let i=0; i<def.extraFlows.length; i++) {
      const p = getPortPos(block, `flowExtra_${i}`, 0);
      drawFlowPort(p.x, p.y, '#ff9f43');
      ctx.fillStyle = '#ff9f43';
      ctx.font = '8px JetBrains Mono';
      ctx.textAlign = 'center';
      ctx.fillText(def.extraFlows[i], p.x, p.y + 14);
      ctx.textAlign = 'left';
    }
  }

  // Data IN ports (left edge)
  const dIn = def.ports?.in||[];
  for (let i=0; i<dIn.length; i++) {
    const p = getPortPos(block, 'dataIn', i);
    drawDataPort(p.x, p.y, '#c97bff');
    ctx.fillStyle = '#8892aa';
    ctx.font = '8px JetBrains Mono';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    ctx.fillText(dIn[i].l, block.x + 9, p.y);
  }

  // Data OUT ports (right edge)
  const dOut = def.ports?.out||[];
  for (let i=0; i<dOut.length; i++) {
    const p = getPortPos(block, 'dataOut', i);
    drawDataPort(p.x, p.y, '#c97bff');
    ctx.fillStyle = '#8892aa';
    ctx.font = '8px JetBrains Mono';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'right';
    ctx.fillText(dOut[i].l, block.x + bw - 9, p.y);
  }
  ctx.textAlign = 'left';

  // Function call: show fn name below label
  if (def.cat === 'call') {
    ctx.fillStyle = '#5b8fff';
    ctx.font = '9px JetBrains Mono';
    ctx.textBaseline = 'middle';
    ctx.fillText(def.fnName+'()', block.x+12, block.y+30);
  }
}

function pxy(p) { return [p.x, p.y]; }

function drawFlowPort(x, y, color) {
  ctx.beginPath(); ctx.arc(x, y, FLOW_R, 0, Math.PI*2);
  ctx.fillStyle = '#13161d'; ctx.fill();
  ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI*2); ctx.fill();
}

function drawDataPort(x, y, color) {
  ctx.beginPath(); ctx.rect(x-PORT_R, y-PORT_R, PORT_R*2, PORT_R*2);
  ctx.fillStyle = '#13161d'; ctx.fill();
  ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = color; ctx.beginPath(); ctx.rect(x-2.5, y-2.5, 5, 5); ctx.fill();
}

function drawConnection(conn) {
  const fb = activeBlocks().find(b=>b.id===conn.fromBlock);
  const tb = activeBlocks().find(b=>b.id===conn.toBlock);
  if (!fb||!tb) return;
  const from = getPortPos(fb, conn.fromPort, conn.fromIdx||0);
  const to   = getPortPos(tb, conn.toPort,   conn.toIdx||0);
  const isFlow = conn.fromPort.startsWith('flow');
  drawBezier(from.x, from.y, to.x, to.y, isFlow ? '#5b8fff70' : '#c97bff70', isFlow ? 2 : 1.5);
}

function drawBezier(x1,y1,x2,y2,color,lw) {
  // For data connections going left→right use horizontal bezier,
  // for flow connections (top→bottom) use vertical bezier
  const dx = x2-x1, dy = y2-y1;
  const cp = Math.max(40, Math.abs(dy)*0.5, Math.abs(dx)*0.5);
  ctx.beginPath(); ctx.moveTo(x1,y1);
  ctx.bezierCurveTo(x1+cp*Math.sign(dx||1), y1, x2-cp*Math.sign(dx||1), y2, x2, y2);
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.stroke();
}

function roundRect(ctx,x,y,w,h,r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r); ctx.closePath();
}
function roundRectLeft(ctx,x,y,w,h,r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w,y); ctx.lineTo(x+w,y+h); ctx.lineTo(x+r,y+h);
  ctx.arcTo(x,y+h,x,y+h-r,r); ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r); ctx.closePath();
}

/* ══════════════════════════════════════
   HIT TESTING
══════════════════════════════════════ */
function hitBlock(wx,wy) {
  const blocks = activeBlocks();
  for (let i=blocks.length-1; i>=0; i--) {
    const b=blocks[i]; const {bw,bh}=blockSize(b);
    if (wx>=b.x && wx<=b.x+bw && wy>=b.y && wy<=b.y+bh) return b;
  }
  return null;
}

function hitPort(wx,wy,block) {
  const def = getBlockDef(block.type);
  const R = 11;

  if (def.flowIn!==false) {
    const p=getPortPos(block,'flowIn',0);
    if (Math.hypot(wx-p.x,wy-p.y)<R) return {portType:'flowIn',idx:0,isFlow:true};
  }
  if (def.flowOut!==false) {
    const p=getPortPos(block,'flowOut',0);
    if (Math.hypot(wx-p.x,wy-p.y)<R) return {portType:'flowOut',idx:0,isFlow:true};
    for (let i=0; i<(def.extraFlows||[]).length; i++) {
      const p2=getPortPos(block,`flowExtra_${i}`,0);
      if (Math.hypot(wx-p2.x,wy-p2.y)<R) return {portType:`flowExtra_${i}`,idx:0,isFlow:true};
    }
  }
  const dIn=def.ports?.in||[];
  for (let i=0; i<dIn.length; i++) {
    const p=getPortPos(block,'dataIn',i);
    if (Math.hypot(wx-p.x,wy-p.y)<R) return {portType:'dataIn',idx:i,isFlow:false};
  }
  const dOut=def.ports?.out||[];
  for (let i=0; i<dOut.length; i++) {
    const p=getPortPos(block,'dataOut',i);
    if (Math.hypot(wx-p.x,wy-p.y)<R) return {portType:'dataOut',idx:i,isFlow:false};
  }
  return null;
}

/* ══════════════════════════════════════
   MOUSE EVENTS
══════════════════════════════════════ */
canvas.addEventListener('mousedown', e => {
  if (e.button===2) return;
  const {x:wx,y:wy} = toWorld(e.offsetX,e.offsetY);
  hideCtx();

  if (state.tool==='pan') {
    const cs=getCS();
    state.pan={active:true,startX:e.clientX,startY:e.clientY,startOX:cs.offsetX,startOY:cs.offsetY};
    canvas.style.cursor='grabbing'; return;
  }

  const block=hitBlock(wx,wy);
  if (block) {
    const port=hitPort(wx,wy,block);
    if (port) {
      state.connecting={block,portType:port.portType,idx:port.idx,isFlow:port.isFlow};
      state.connectingMouse={x:wx,y:wy}; return;
    }
    state.selected=block;
    state.dragging={block,offX:wx-block.x,offY:wy-block.y};
    const tab=activeTab(); const i=tab.blocks.indexOf(block);
    tab.blocks.splice(i,1); tab.blocks.push(block);
    draw(); return;
  }
  state.selected=null;
  const cs=getCS();
  state.pan={active:true,startX:e.clientX,startY:e.clientY,startOX:cs.offsetX,startOY:cs.offsetY};
  draw();
});

canvas.addEventListener('mousemove', e => {
  const {x:wx,y:wy}=toWorld(e.offsetX,e.offsetY);
  if (state.pan.active) {
    const cs=getCS();
    cs.offsetX=state.pan.startOX+(e.clientX-state.pan.startX);
    cs.offsetY=state.pan.startOY+(e.clientY-state.pan.startY);
    draw(); return;
  }
  if (state.dragging) {
    state.dragging.block.x=wx-state.dragging.offX;
    state.dragging.block.y=wy-state.dragging.offY;
    draw(); return;
  }
  if (state.connecting) {
    state.connectingMouse={x:wx,y:wy}; draw(); return;
  }
  const block=hitBlock(wx,wy);
  canvas.style.cursor = block ? (hitPort(wx,wy,block)?'crosshair':'grab') : (state.tool==='pan'?'grab':'default');
});

canvas.addEventListener('mouseup', e => {
  const {x:wx,y:wy}=toWorld(e.offsetX,e.offsetY);
  if (state.pan.active) { state.pan.active=false; canvas.style.cursor=state.tool==='pan'?'grab':'default'; }
  if (state.connecting) {
    const {block:fb,portType:fp,idx:fi,isFlow:fIsFlow}=state.connecting;
    const tb=hitBlock(wx,wy);
    if (tb && tb!==fb) {
      const tp=hitPort(wx,wy,tb);
      if (tp && tp.isFlow===fIsFlow) {
        const fromIsOut=fp.startsWith('flowOut')||fp.startsWith('flowExtra')||fp==='dataOut';
        const toIsIn=tp.portType==='flowIn'||tp.portType==='dataIn';
        if (fromIsOut&&toIsIn) {
          activeConns().push({id:state.nextBlockId++,fromBlock:fb.id,fromPort:fp,fromIdx:fi,toBlock:tb.id,toPort:tp.portType,toIdx:tp.idx});
        }
      }
    }
    state.connecting=null; state.connectingMouse=null; draw(); return;
  }
  if (state.dragging) { state.dragging=null; canvas.style.cursor='default'; }
});

canvas.addEventListener('dblclick', e => {
  const {x:wx,y:wy}=toWorld(e.offsetX,e.offsetY);
  const block=hitBlock(wx,wy);
  if (block) openEditModal(block);
});

canvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  const {x:wx,y:wy}=toWorld(e.offsetX,e.offsetY);
  const block=hitBlock(wx,wy);
  if (block) { state.ctxTarget=block; state.selected=block; showCtx(e.clientX,e.clientY); draw(); }
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const cs=getCS(); const f=e.deltaY<0?1.1:0.9;
  const ns=Math.min(3,Math.max(0.2,cs.scale*f));
  cs.offsetX=e.offsetX-(e.offsetX-cs.offsetX)*(ns/cs.scale);
  cs.offsetY=e.offsetY-(e.offsetY-cs.offsetY)*(ns/cs.scale);
  cs.scale=ns; draw();
},{passive:false});

/* ══════════════════════════════════════
   DROP FROM PALETTE
══════════════════════════════════════ */
let dragPaletteType=null;
document.getElementById('palette-scroll').addEventListener('dragstart',e=>{
  const el=e.target.closest('.palette-block'); if(el) dragPaletteType=el.dataset.type;
});
wrap.addEventListener('dragover',e=>e.preventDefault());
wrap.addEventListener('drop',e=>{
  e.preventDefault(); if(!dragPaletteType) return;
  const rect=canvas.getBoundingClientRect();
  const {x:wx,y:wy}=toWorld(e.clientX-rect.left,e.clientY-rect.top);
  const def=getBlockDef(dragPaletteType);
  const {bw,bh}=blockSize({type:dragPaletteType});
  addBlock(dragPaletteType,wx-bw/2,wy-bh/2);
  dragPaletteType=null;
});

function addBlock(type,x,y) {
  const def=getBlockDef(type);
  const block={id:state.nextBlockId++,type,x,y,data:{}};
  for (const f of (def.fields||[])) block.data[f.k]=f.default??'';
  activeBlocks().push(block);
  state.selected=block; draw(); return block;
}

/* ══════════════════════════════════════
   PALETTE
══════════════════════════════════════ */
function paletteLabel(def) {
  if (def.cat==='op') {
    const sym=OP_SYMS[def.type||'']||def.label;
    if (def.type==='op_not') return `not a`;
    return `a ${sym} b`;
  }
  return def.label;
}

function buildPalette() {
  const scroll=document.getElementById('palette-scroll');
  scroll.innerHTML='';
  const groups=[...PALETTE_GROUPS];

  // Function call blocks
  const fnTabs=state.tabs.filter(t=>!t.isMain);
  if (fnTabs.length>0) {
    groups.push({title:'Calls',types:fnTabs.map(t=>'call_fn_'+t.id)});
    for (const ft of fnTabs) {
      const key='call_fn_'+ft.id;
      BLOCK_DEFS[key]={
        label:ft.name,color:'#4af0b0',cat:'call',compact:false,fnName:ft.name,fnTab:ft.id,
        flowIn:true,flowOut:true,extraFlows:[],
        ports:{
          in: ft.params.map(p=>({l:p.name})),
          out:ft.returns.map(r=>({l:r.name}))  // ← return values as named OUT ports
        },
        fields:[]
      };
    }
  }
  if (state.libBlocks.length>0) groups.push({title:'Library',types:state.libBlocks.map(b=>b.type)});

  for (const grp of groups) {
    const g=document.createElement('div'); g.className='palette-group';
    g.innerHTML=`<div class="palette-group-title">${grp.title}</div>`;
    for (const type of grp.types) {
      const def=getBlockDef(type);
      // attach type to def so paletteLabel can read it
      def.type=type;
      const el=document.createElement('div');
      el.className='palette-block'; el.draggable=true; el.dataset.type=type;
      el.innerHTML=`<div class="pb-color" style="background:${def.color}"></div>
        <div class="pb-info">
          <div class="pb-name">${paletteLabel(def)}</div>
          <div class="pb-desc">${def.cat}</div>
        </div>`;
      g.appendChild(el);
    }
    scroll.appendChild(g);
  }
}

/* ══════════════════════════════════════
   TABS
══════════════════════════════════════ */
function buildTabs() {
  const bar=document.getElementById('topbar');
  bar.querySelectorAll('.tab').forEach(e=>e.remove());
  const btnNew=document.getElementById('btn-new-tab');
  for (const tab of state.tabs) {
    const el=document.createElement('div');
    el.className='tab'+(tab.id===state.activeTab?' active':'');
    el.dataset.tabId=tab.id;
    el.innerHTML=`<span style="font-size:10px;opacity:.6">${tab.isMain?'⬡':'ƒ'}</span>
      <span>${tab.name}</span>
      ${!tab.isMain?`<span class="tab-close" data-close="${tab.id}">×</span>`:''}`;
    el.addEventListener('click',e=>{
      if(e.target.dataset.close){removeTab(parseInt(e.target.dataset.close));return;}
      switchTab(tab.id);
    });
    bar.insertBefore(el,btnNew);
  }
}

function switchTab(id){
  state.activeTab=id; buildTabs(); buildSidebar(); buildPalette(); draw();
}
function removeTab(id){
  const i=state.tabs.findIndex(t=>t.id===id); if(i<0)return;
  state.tabs.splice(i,1); delete state.canvasState[id]; delete BLOCK_DEFS['call_fn_'+id];
  if(state.activeTab===id) state.activeTab=state.tabs[0].id;
  buildTabs(); buildSidebar(); buildPalette(); draw();
}

document.getElementById('btn-new-tab').addEventListener('click',()=>{
  document.getElementById('fn-name-input').value='my_func';
  document.getElementById('fn-modal').classList.add('show');
  document.getElementById('fn-name-input').focus();
  document.getElementById('fn-name-input').select();
});
document.getElementById('fn-cancel').addEventListener('click',()=>document.getElementById('fn-modal').classList.remove('show'));
document.getElementById('fn-ok').addEventListener('click',()=>{
  const name=document.getElementById('fn-name-input').value.trim()||'func';
  const id=state.nextTabId++;
  state.tabs.push({id,name,isMain:false,blocks:[],connections:[],localVars:[],params:[],returns:[]});
  state.canvasState[id]={offsetX:0,offsetY:0,scale:1};
  document.getElementById('fn-modal').classList.remove('show');
  switchTab(id);
});

/* ══════════════════════════════════════
   SIDEBAR
══════════════════════════════════════ */
function buildSidebar(){
  const tab=activeTab();
  document.getElementById('fn-vars-section').style.display=tab?.isMain?'none':'';
  renderVarList('global-var-list',state.globalVars,'global');
  if(!tab?.isMain&&tab){
    renderVarList('local-var-list',tab.localVars,'local');
    renderVarList('param-list',tab.params,'param');
    renderVarList('return-list',tab.returns,'return');
  }
}

function renderVarList(cid,list,kind){
  const c=document.getElementById(cid); if(!c)return;
  c.innerHTML='';
  for (const v of list){
    const el=document.createElement('div'); el.className='var-item'; el.dataset.id=v.id; el.draggable=true;
    const hasVal=kind==='global'||kind==='local';
    el.innerHTML=`<span class="drag-handle">⠿</span>
      <input type="text" placeholder="name" value="${v.name}" data-field="name" data-id="${v.id}" data-kind="${kind}">
      ${hasVal?`<input type="text" placeholder="None" value="${v.value||''}" data-field="value" data-id="${v.id}" data-kind="${kind}" style="width:55px;color:var(--accent4)">` : ''}
      <span class="var-del" data-del="${v.id}" data-kind="${kind}">×</span>`;
    c.appendChild(el);
  }
  c.querySelectorAll('input[data-field]').forEach(inp=>inp.addEventListener('change',()=>{
    const v=getVarById(parseInt(inp.dataset.id),inp.dataset.kind);
    if(v) v[inp.dataset.field]=inp.value;
    buildPalette(); draw();
  }));
  c.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>removeVar(parseInt(b.dataset.del),b.dataset.kind)));
  setupVarDrag(c,list);
}

function setupVarDrag(c,list){
  let from=null;
  c.querySelectorAll('.var-item').forEach(el=>{
    el.addEventListener('dragstart',e=>{from=parseInt(el.dataset.id);e.stopPropagation()});
    el.addEventListener('dragover',e=>e.preventDefault());
    el.addEventListener('drop',e=>{
      e.stopPropagation();
      const to=parseInt(el.dataset.id); if(from===to)return;
      const fi=list.findIndex(v=>v.id===from), ti=list.findIndex(v=>v.id===to);
      const [item]=list.splice(fi,1); list.splice(ti,0,item);
      buildSidebar();
    });
  });
}

function getVarById(id,kind){
  if(kind==='global')return state.globalVars.find(v=>v.id===id);
  const tab=activeTab(); if(!tab)return null;
  if(kind==='local')return tab.localVars.find(v=>v.id===id);
  if(kind==='param')return tab.params.find(v=>v.id===id);
  if(kind==='return')return tab.returns.find(v=>v.id===id);
}
function removeVar(id,kind){
  const lists={global:state.globalVars,local:activeTab()?.localVars,param:activeTab()?.params,return:activeTab()?.returns};
  const l=lists[kind]; if(!l)return;
  const i=l.findIndex(v=>v.id===id); if(i>=0)l.splice(i,1);
  buildSidebar(); buildPalette();
}
function addVar(kind){
  const names={param:'arg',return:'ret',local:'var',global:'var'};
  const v={id:state.nextVarId++,name:names[kind]||'var',value:''};
  if(kind==='global') state.globalVars.push(v);
  else {
    const tab=activeTab(); if(!tab)return;
    if(kind==='local')tab.localVars.push(v);
    if(kind==='param')tab.params.push(v);
    if(kind==='return')tab.returns.push(v);
  }
  buildSidebar(); buildPalette();
}
document.getElementById('btn-add-global').addEventListener('click',()=>addVar('global'));
document.getElementById('btn-add-local')?.addEventListener('click',()=>addVar('local'));
document.getElementById('btn-add-param')?.addEventListener('click',()=>addVar('param'));
document.getElementById('btn-add-return')?.addEventListener('click',()=>addVar('return'));

document.getElementById('tool-fit').addEventListener('click',()=>{
  const blocks=activeBlocks(); if(!blocks.length){const cs=getCS();cs.offsetX=0;cs.offsetY=0;cs.scale=1;draw();return;}
  const xs=blocks.map(b=>b.x); const ys=blocks.map(b=>b.y);
  const minX=Math.min(...xs),minY=Math.min(...ys);
  const maxX=Math.max(...blocks.map(b=>b.x+(blockSize(b).bw)));
  const maxY=Math.max(...blocks.map(b=>b.y+(blockSize(b).bh)));
  const pad=60;
  const sx=(canvas.width-pad*2)/(maxX-minX||1), sy=(canvas.height-pad*2)/(maxY-minY||1);
  const cs=getCS(); cs.scale=Math.min(2,Math.min(sx,sy));
  cs.offsetX=canvas.width/2-((minX+maxX)/2)*cs.scale;
  cs.offsetY=canvas.height/2-((minY+maxY)/2)*cs.scale;
  draw();
});

/* ══════════════════════════════════════
   SAVE / LOAD CHART
══════════════════════════════════════ */
document.getElementById('btn-save-chart').addEventListener('click', saveChart);
document.getElementById('btn-load-chart').addEventListener('click', () => document.getElementById('chart-input').click());
document.getElementById('chart-input').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try { loadChart(JSON.parse(ev.target.result)); }
    catch(err) { alert('Failed to load chart: ' + err.message); }
  };
  reader.readAsText(file);
  document.getElementById('chart-input').value = '';
});

function saveChart() {
  const payload = {
    version: 1,
    tabs:         state.tabs,
    globalVars:   state.globalVars,
    canvasState:  state.canvasState,
    activeTab:    state.activeTab,
    nextTabId:    state.nextTabId,
    nextBlockId:  state.nextBlockId,
    nextVarId:    state.nextVarId,
    initCode:     state.initCode,
    libCode:      state.libCode,
    libBlockDefs: state.libBlocks,
  };
  const json = JSON.stringify(payload, null, 2);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
  const name = state.tabs.find(t => t.isMain)?.name || 'chart';
  a.download = name + '.flowscript';
  a.click();
}

function loadChart(payload) {
  if (!payload.version) throw new Error('Not a valid .flowscript file');

  state.tabs        = payload.tabs;
  state.globalVars  = payload.globalVars;
  state.canvasState = payload.canvasState;
  state.activeTab   = payload.activeTab;
  state.nextTabId   = payload.nextTabId;
  state.nextBlockId = payload.nextBlockId;
  state.nextVarId   = payload.nextVarId;
  state.initCode    = payload.initCode  || '';
  state.libCode     = payload.libCode   || '';

  state.dragging = null; state.connecting = null; state.connectingMouse = null;
  state.selected = null; state.ctxTarget = null;

  // Re-parse lib so palette blocks are live (also covers saved libBlockDefs as fallback)
  if (state.libCode) {
    parseLib(state.libCode);
  } else {
    state.libBlocks = payload.libBlockDefs || [];
    for (const def of state.libBlocks) BLOCK_DEFS[def.type] = def;
  }

  // Rebuild call_fn_* defs from function tabs
  for (const ft of state.tabs.filter(t => !t.isMain)) {
    const key = 'call_fn_' + ft.id;
    BLOCK_DEFS[key] = {
      label: ft.name, color: '#4af0b0', cat: 'call', compact: false,
      fnName: ft.name, fnTab: ft.id,
      flowIn: true, flowOut: true, extraFlows: [],
      ports: {
        in:  ft.params.map(p => ({ l: p.name })),
        out: ft.returns.map(r => ({ l: '__'+r.name })),
      },
      fields: [],
    };
  }

  buildTabs(); buildSidebar(); buildPalette(); draw(); updateFileButtons();
}

function parseLib(code){
  state.libBlocks=[];
  // Split into function blocks so we can inspect each body
  const lines=code.split('\n');
  const fnStarts=[];
  const defRe=/^def\s+(\w+)\s*\(([^)]*)\)/;
  lines.forEach((ln,i)=>{ const m=ln.match(defRe); if(m) fnStarts.push({i,name:m[1],args:m[2]}); });

  fnStarts.forEach((fn,fi)=>{
    const bodyLines=lines.slice(fn.i+1, fnStarts[fi+1]?.i ?? lines.length);
    // Find return statements; take the last one to determine output count/names
    let outPorts=[{l:'__ret'}];
    for(const bl of bodyLines){
      const rm=bl.match(/^\s+return\s+(.+)/);
      if(!rm) continue;
      const parts=rm[1].split(',').map(s=>s.trim()).filter(Boolean);
      if(parts.length===1){
        // single return — name it after the function if it's a plain identifier, else __ret
        const ident=parts[0].match(/^[A-Za-z_]\w*$/);
        outPorts=[{l: ident ? '__'+ident[0] : '__ret'}];
      } else {
        outPorts=parts.map((p,i)=>{ const id=p.match(/^[A-Za-z_]\w*$/); return {l: id?'__'+id[0]:'__ret'+i}; });
      }
    }
    const args=fn.args.split(',').map(a=>a.trim()).filter(Boolean);
    const type='lib_'+fn.name;
    const def={type,label:fn.name+'()',color:'#ff9f43',cat:'lib',compact:false,flowIn:true,flowOut:true,extraFlows:[],
               ports:{in:args.map(a=>({l:a.split('=')[0].trim()})),out:outPorts},fields:[]};
    BLOCK_DEFS[type]=def;
    state.libBlocks.push(def);
  });
}

/* ══════════════════════════════════════
   CODE GENERATION
   
   Function return values are now proper named output data ports.
   When a call block has return values, they are assigned to the
   variable names of whatever is connected to its output ports,
   or to the return variable names as fallback.
══════════════════════════════════════ */
document.getElementById('btn-generate').addEventListener('click', generateCode);

function generateCode(){
  let code='';
  const ind=n=>'    '.repeat(n);

  if(state.initCode.trim()) code+='# === init.py ===\n'+state.initCode.trim()+'\n\n';
  if(state.libCode.trim())  code+='# === lib.py ===\n'+state.libCode.trim()+'\n\n';

  if(state.globalVars.length){
    code+='# === Global Variables ===\n';
    for(const v of state.globalVars) code+=`${v.name} = ${v.value.trim()||'None'}\n`;
    code+='\n';
  }

  // Function defs
  for(const ft of state.tabs.filter(t=>!t.isMain)){
    const params=ft.params.map(p=>p.name).join(', ');
    code+=`def ${ft.name}(${params}):\n`;
    for(const lv of ft.localVars) code+=ind(1)+`${lv.name} = ${lv.value||'None'}\n`;
    code+=generateFlowCode(ft,1);
    // Final return of all return vars
    if(ft.returns.length) code+=ind(1)+`return ${ft.returns.map(r=>r.name).join(', ')}\n`;
    code+='\n';
  }

  const mainTab=state.tabs.find(t=>t.isMain);
  code+='# === Main Program ===\n'+generateFlowCode(mainTab,0);

  document.getElementById('code-out').textContent=code;
  document.getElementById('code-modal').classList.add('show');
}

function generateFlowCode(tab,indentLevel){
  const blocks=tab.blocks, conns=tab.connections;
  let code='';
  const ind=n=>'    '.repeat(n);

  const startBlock=blocks.find(b=>b.type==='start')
    || blocks.find(b=>{const d=getBlockDef(b.type);return d.flowIn===false&&d.flowOut!==false;});

  const visited=new Set();

  function followFlow(block,depth){
    if(!block||visited.has(block.id))return;
    visited.add(block.id);
    const def=getBlockDef(block.type);
    const il=indentLevel+depth;

    switch(block.type){
      case 'start': case 'end_main': break;
      case 'comment': code+=ind(il)+`# ${block.data?.text||''}\n`; break;

      case 'set_var':
        code+=ind(il)+`${block.data?.name||'var'} = ${resolveDataIn(block,0,conns,blocks)}\n`;
        break;

      case 'print_blk':
        code+=ind(il)+`print(${resolveDataIn(block,0,conns,blocks)})\n`;
        break;

      case 'delay':
        code+=ind(il)+`time.sleep_ms(${block.data?.ms||resolveDataIn(block,0,conns,blocks)})\n`;
        break;

      case 'if_block':{
        const cond=resolveDataIn(block,0,conns,blocks);
        code+=ind(il)+`if ${cond}:\n`;
        const trueNext=flowNext(block,'flowOut',conns,blocks);
        if(trueNext) followFlow(trueNext,depth+1); else code+=ind(il+1)+'pass\n';
        const falseNext=flowNext(block,'flowExtra_0',conns,blocks);
        if(falseNext){code+=ind(il)+'else:\n'; followFlow(falseNext,depth+1);}
        return;
      }
      case 'for_loop':{
        const iter=resolveDataIn(block,0,conns,blocks);
        code+=ind(il)+`for ${block.data?.var||'i'} in ${iter}:\n`;
        const body=flowNext(block,'flowOut',conns,blocks);
        if(body) followFlow(body,depth+1); else code+=ind(il+1)+'pass\n';
        const exit=flowNext(block,'flowExtra_0',conns,blocks);
        if(exit) followFlow(exit,depth);
        return;
      }
      case 'while_loop':{
        const cond=resolveDataIn(block,0,conns,blocks);
        code+=ind(il)+`while ${cond}:\n`;
        const body=flowNext(block,'flowOut',conns,blocks);
        if(body) followFlow(body,depth+1); else code+=ind(il+1)+'pass\n';
        const exit=flowNext(block,'flowExtra_0',conns,blocks);
        if(exit) followFlow(exit,depth);
        return;
      }
      case 'break_blk':  code+=ind(il)+'break\n'; return;
      case 'ret_block':  code+=ind(il)+'return\n'; return;

      default:
        if(def.cat==='call'){
          const fnTab=state.tabs.find(t=>t.id===def.fnTab);
          if(fnTab){
            const args=fnTab.params.map((_,i)=>resolveDataIn(block,i,conns,blocks)).join(', ');
            // Return values: look at what is connected to each dataOut port
            // If nothing connected, use the return var name as a local capture variable
            const lhsParts=fnTab.returns.map((r,i)=>{
              const dest=resolveDataOut(block,i,conns,blocks);
              return dest||('__'+r.name);
            });
            const lhs=lhsParts.length?lhsParts.join(', ')+' = ':'';
            code+=ind(il)+`${lhs}${fnTab.name}(${args})\n`;
          }
        } else if(def.cat==='lib'){
          const args=(def.ports.in||[]).map((_,i)=>resolveDataIn(block,i,conns,blocks)).join(', ');
          const fnName=def.label.replace('()','');
          const outs=def.ports.out||[];
          // LHS: prefer what's connected downstream, else use the __name from the port def
          const lhs=outs.length
            ?(outs.map((p,i)=>resolveDataOut(block,i,conns,blocks)||p.l).join(', '))+' = '
            :'';
          code+=ind(il)+`${lhs}${fnName}(${args})\n`;
        }
    }

    // continue flow
    if(def.flowOut!==false&&!['if_block','for_loop','while_loop'].includes(block.type)){
      const next=flowNext(block,'flowOut',conns,blocks);
      if(next) followFlow(next,depth);
    }
  }

  followFlow(startBlock,0);

  // Unconnected flow blocks
  for(const b of blocks){
    if(!visited.has(b.id)){
      const def=getBlockDef(b.type);
      if(def.flowIn!==false||def.flowOut!==false) code+=ind(indentLevel)+`# [unconnected: ${def.label}]\n`;
    }
  }

  if(!code.trim()) code=ind(indentLevel)+'pass\n';
  return code;
}

function flowNext(block,portType,conns,blocks){
  const c=conns.find(c=>c.fromBlock===block.id&&c.fromPort===portType);
  return c?blocks.find(b=>b.id===c.toBlock):null;
}

/** Resolve what value expression feeds into dataIn port idx of a block */
function resolveDataIn(block,idx,conns,blocks){
  const conn=conns.find(c=>c.toBlock===block.id&&c.toPort==='dataIn'&&c.toIdx===idx);
  if(!conn) return '_';
  const src=blocks.find(b=>b.id===conn.fromBlock); if(!src)return '_';
  return resolveBlockOutput(src,conn.fromIdx||0,conns,blocks);
}

/** Resolve the expression a block outputs at output port idx */
function resolveBlockOutput(block,outIdx,conns,blocks){
  const def=getBlockDef(block.type);
  if(block.type==='data_blk')  return block.data?.value||'0';
  if(block.type==='read_var')  return block.data?.name||'var';
  if(def.cat==='op')           return resolveOp(block,conns,blocks);
  if(def.cat==='call'){
    // output port outIdx corresponds to return value at that index
    const fnTab=state.tabs.find(t=>t.id===def.fnTab);
    if(fnTab&&fnTab.returns[outIdx]) return '__'+fnTab.returns[outIdx].name;
  }
  if(def.cat==='lib'){
    const outPort=(def.ports.out||[])[outIdx];
    return outPort?outPort.l : def.label.replace('()','')+'__ret';
  }
  return block.data?.name||'_';
}

/** What variable name should receive the dataOut port outIdx of block (used for call LHS) */
function resolveDataOut(block,outIdx,conns,blocks){
  // Find a set_var block connected to this output, or a read_var, or nothing
  const conn=conns.find(c=>c.fromBlock===block.id&&c.fromPort==='dataOut'&&(c.fromIdx||0)===outIdx);
  if(!conn) return null;
  const dest=blocks.find(b=>b.id===conn.toBlock); if(!dest)return null;
  const destDef=getBlockDef(dest.type);
  if(dest.type==='set_var') return dest.data?.name||null;
  if(dest.type==='read_var') return dest.data?.name||null;
  return null;
}

function resolveOp(block,conns,blocks){
  // Port connection takes priority; fall back to edited literal value, then '_'
  const aConn=conns.find(c=>c.toBlock===block.id&&c.toPort==='dataIn'&&c.toIdx===0);
  const bConn=conns.find(c=>c.toBlock===block.id&&c.toPort==='dataIn'&&c.toIdx===1);
  const aSrc=aConn?blocks.find(b=>b.id===aConn.fromBlock):null;
  const bSrc=bConn?blocks.find(b=>b.id===bConn.fromBlock):null;
  const a=aSrc?resolveBlockOutput(aSrc,aConn.fromIdx||0,conns,blocks):(block.data?.a||'_');
  const b=bSrc?resolveBlockOutput(bSrc,bConn.fromIdx||0,conns,blocks):(block.data?.b||'_');
  const pyOps={op_add:'+',op_sub:'-',op_mul:'*',op_div:'/',op_mod:'%',
               op_eq:'==',op_neq:'!=',op_lt:'<',op_gt:'>',op_and:'and',op_or:'or'};
  if(block.type==='op_not') return `not ${a}`;
  return `(${a} ${pyOps[block.type]||'?'} ${b})`;
}

/* code modal */
document.getElementById('btn-copy-code').addEventListener('click',()=>{
  navigator.clipboard.writeText(document.getElementById('code-out').textContent);
  document.getElementById('btn-copy-code').textContent='✓ Copied';
  setTimeout(()=>document.getElementById('btn-copy-code').textContent='📋 Copy',1500);
});
document.getElementById('btn-dl-code').addEventListener('click',()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([document.getElementById('code-out').textContent],{type:'text/plain'}));
  a.download='main.py'; a.click();
});
document.getElementById('code-close').addEventListener('click',()=>document.getElementById('code-modal').classList.remove('show'));
document.querySelectorAll('.modal-overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('show');}));
document.getElementById('fn-name-input').addEventListener('keydown',e=>{
  if(e.key==='Enter')document.getElementById('fn-ok').click();
  if(e.key==='Escape')document.getElementById('fn-cancel').click();
});

/* ══════════════════════════════════════
   INIT
══════════════════════════════════════ */
function init(){
  resize(); buildPalette(); buildSidebar(); buildTabs();
  const tab=state.tabs[0];
  tab.blocks.push(
    {id:state.nextBlockId++,type:'start',x:260,y:80,data:{}},
    {id:state.nextBlockId++,type:'end_main',x:260,y:300,data:{}}
  );
  const cs=getCS();
  cs.offsetX=wrap.clientWidth/2-(260+BW_NORMAL/2)*cs.scale;
  cs.offsetY=40;
  draw(); updateFileButtons();
}
init();
</script>
