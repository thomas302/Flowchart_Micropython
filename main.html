<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowScript — MicroPython Visual IDE</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Syne:wght@400;500;600;700;800&display=swap');

  :root {
    --bg: #0d0f14;
    --surface: #13161d;
    --surface2: #1a1e28;
    --surface3: #222736;
    --border: #2a3045;
    --border2: #3a4560;
    --accent: #4af0b0;
    --accent2: #5b8fff;
    --accent3: #ff6b6b;
    --accent4: #ffc85a;
    --accent5: #c97bff;
    --text: #e8eaf0;
    --text2: #8892aa;
    --text3: #5a6478;
    --tab-h: 42px;
    --left-w: 220px;
    --right-w: 240px;
    --block-r: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── TOP BAR ── */
  #topbar {
    height: var(--tab-h);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: stretch;
    gap: 0;
    flex-shrink: 0;
    overflow-x: auto;
    overflow-y: hidden;
  }
  #topbar::-webkit-scrollbar { height: 3px; }
  #topbar::-webkit-scrollbar-track { background: transparent; }
  #topbar::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  .tab {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 14px;
    cursor: pointer;
    border-right: 1px solid var(--border);
    white-space: nowrap;
    color: var(--text2);
    font-family: 'Syne', sans-serif;
    font-size: 12px;
    font-weight: 500;
    transition: background 0.15s, color 0.15s;
    position: relative;
    min-width: 80px;
  }
  .tab:hover { background: var(--surface2); color: var(--text); }
  .tab.active {
    background: var(--surface2);
    color: var(--accent);
  }
  .tab.active::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: var(--accent);
  }
  .tab .tab-icon { font-size: 11px; opacity: 0.7; }
  .tab .tab-close {
    margin-left: 4px;
    opacity: 0;
    font-size: 14px;
    line-height: 1;
    color: var(--text3);
    transition: opacity 0.1s, color 0.1s;
  }
  .tab:hover .tab-close { opacity: 1; }
  .tab .tab-close:hover { color: var(--accent3); }

  #btn-new-tab {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 14px;
    cursor: pointer;
    color: var(--text3);
    font-size: 18px;
    transition: color 0.15s, background 0.15s;
    border-right: 1px solid var(--border);
  }
  #btn-new-tab:hover { color: var(--accent); background: var(--surface2); }

  #topbar-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 12px;
    border-left: 1px solid var(--border);
  }
  .top-btn {
    padding: 4px 12px;
    border-radius: 4px;
    border: 1px solid var(--border2);
    background: transparent;
    color: var(--text2);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .top-btn:hover { border-color: var(--accent); color: var(--accent); }
  .top-btn.primary { border-color: var(--accent); color: var(--accent); }
  .top-btn.primary:hover { background: var(--accent); color: var(--bg); }

  /* ── MAIN LAYOUT ── */
  #main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  /* ── LEFT PALETTE ── */
  #palette {
    width: var(--left-w);
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
  }
  #palette-header {
    padding: 10px 12px 8px;
    font-family: 'Syne', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text3);
    border-bottom: 1px solid var(--border);
  }
  #palette-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }
  #palette-scroll::-webkit-scrollbar { width: 4px; }
  #palette-scroll::-webkit-scrollbar-track { background: transparent; }
  #palette-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .palette-group { margin-bottom: 10px; }
  .palette-group-title {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text3);
    padding: 4px 4px 6px;
    font-family: 'Syne', sans-serif;
  }

  .palette-block {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 8px;
    border-radius: var(--block-r);
    border: 1px solid var(--border);
    background: var(--surface2);
    margin-bottom: 4px;
    cursor: grab;
    transition: border-color 0.15s, background 0.15s, transform 0.1s;
    user-select: none;
  }
  .palette-block:hover {
    border-color: var(--border2);
    background: var(--surface3);
    transform: translateX(2px);
  }
  .palette-block:active { cursor: grabbing; }
  .palette-block .pb-color {
    width: 8px;
    height: 28px;
    border-radius: 3px;
    flex-shrink: 0;
  }
  .palette-block .pb-info { flex: 1; min-width: 0; }
  .palette-block .pb-name {
    font-size: 11px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .palette-block .pb-desc {
    font-size: 9px;
    color: var(--text3);
    margin-top: 1px;
  }

  /* ── CANVAS AREA ── */
  #canvas-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 1px 1px, var(--border) 1px, transparent 0);
    background-size: 24px 24px;
  }
  #main-canvas {
    position: absolute;
    top: 0; left: 0;
    cursor: default;
  }

  /* canvas toolbar */
  #canvas-tools {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px;
    z-index: 10;
  }
  .ctool {
    width: 28px; height: 28px;
    border-radius: 5px;
    border: none;
    background: transparent;
    color: var(--text2);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    transition: all 0.15s;
  }
  .ctool:hover { background: var(--surface2); color: var(--text); }
  .ctool.active { background: var(--surface3); color: var(--accent); }

  /* ── RIGHT SIDEBAR ── */
  #sidebar {
    width: var(--right-w);
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
  }
  #sidebar-header {
    padding: 10px 12px 8px;
    font-family: 'Syne', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text3);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  #sidebar-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }
  #sidebar-scroll::-webkit-scrollbar { width: 4px; }
  #sidebar-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .var-section-title {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text3);
    padding: 4px 4px 6px;
    font-family: 'Syne', sans-serif;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .var-section-title .toggle-pair {
    display: flex;
    gap: 4px;
  }
  .toggle-btn {
    font-size: 8px;
    padding: 2px 5px;
    border-radius: 3px;
    border: 1px solid var(--border2);
    background: transparent;
    color: var(--text3);
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    transition: all 0.15s;
  }
  .toggle-btn.on { border-color: var(--accent2); color: var(--accent2); background: rgba(91,143,255,0.08); }
  .toggle-btn:hover { border-color: var(--border2); color: var(--text); }

  .var-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface2);
    margin-bottom: 4px;
    cursor: grab;
    transition: border-color 0.15s;
    position: relative;
  }
  .var-item:hover { border-color: var(--border2); }
  .var-item:active { cursor: grabbing; }
  .var-item .drag-handle {
    color: var(--text3);
    font-size: 10px;
    cursor: grab;
    flex-shrink: 0;
  }
  .var-item input {
    background: transparent;
    border: none;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    width: 100%;
    outline: none;
    min-width: 0;
  }
  .var-item input::placeholder { color: var(--text3); }
  .var-item input:focus { color: var(--accent); }
  .var-item .var-del {
    color: var(--text3);
    cursor: pointer;
    font-size: 13px;
    flex-shrink: 0;
    transition: color 0.1s;
    opacity: 0;
  }
  .var-item:hover .var-del { opacity: 1; }
  .var-item .var-del:hover { color: var(--accent3); }
  .var-type-badge {
    font-size: 8px;
    padding: 1px 4px;
    border-radius: 2px;
    background: var(--surface3);
    color: var(--text3);
    flex-shrink: 0;
  }

  .add-var-btn {
    width: 100%;
    padding: 6px;
    border-radius: 6px;
    border: 1px dashed var(--border2);
    background: transparent;
    color: var(--text3);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
    margin-top: 2px;
  }
  .add-var-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(74,240,176,0.04); }

  .sidebar-divider {
    height: 1px;
    background: var(--border);
    margin: 10px 0;
  }

  /* ── MODALS ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .modal-overlay.show { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 12px;
    padding: 24px;
    min-width: 360px;
    max-width: 90vw;
    transform: translateY(10px);
    transition: transform 0.2s;
  }
  .modal-overlay.show .modal { transform: none; }
  .modal h2 {
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 16px;
  }
  .modal label {
    display: block;
    font-size: 10px;
    color: var(--text3);
    margin-bottom: 4px;
    margin-top: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .modal input, .modal textarea {
    width: 100%;
    padding: 8px 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    outline: none;
    transition: border-color 0.15s;
  }
  .modal input:focus, .modal textarea:focus { border-color: var(--accent2); }
  .modal textarea { resize: vertical; min-height: 80px; }
  .modal-btns {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 20px;
  }
  .modal-btn {
    padding: 8px 18px;
    border-radius: 6px;
    border: 1px solid var(--border2);
    background: transparent;
    color: var(--text2);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .modal-btn:hover { background: var(--surface2); color: var(--text); }
  .modal-btn.ok { border-color: var(--accent); color: var(--accent); }
  .modal-btn.ok:hover { background: var(--accent); color: var(--bg); }

  /* ── CODE OUTPUT ── */
  #code-modal .modal { min-width: 600px; max-height: 80vh; display: flex; flex-direction: column; }
  #code-out {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    font-size: 11px;
    color: var(--accent);
    overflow-y: auto;
    max-height: 50vh;
    white-space: pre;
    font-family: 'JetBrains Mono', monospace;
    line-height: 1.6;
  }

  /* ── CANVAS BLOCKS (drawn via JS but tooltip overlay) ── */
  #tooltip {
    position: fixed;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 10px;
    color: var(--text2);
    pointer-events: none;
    z-index: 50;
    opacity: 0;
    transition: opacity 0.1s;
  }

  /* ── CONTEXT MENU ── */
  #ctx-menu {
    position: fixed;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 8px;
    padding: 4px;
    z-index: 60;
    min-width: 150px;
    display: none;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .ctx-item {
    padding: 7px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
    color: var(--text2);
    transition: background 0.1s, color 0.1s;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .ctx-item:hover { background: var(--surface3); color: var(--text); }
  .ctx-item.danger:hover { background: rgba(255,107,107,0.1); color: var(--accent3); }
  .ctx-divider { height: 1px; background: var(--border); margin: 3px 0; }

  /* scrollbar global */
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<!-- TOP TABS -->
<div id="topbar">
  <div class="tab active" data-tab="0">
    <span class="tab-icon">⬡</span>
    <span class="tab-name">main</span>
  </div>
  <div id="btn-new-tab" title="New Function">+</div>
  <div id="topbar-right">
    <button class="top-btn" id="btn-load-lib">📂 Load lib.py</button>
    <button class="top-btn" id="btn-load-init">📂 Load init.py</button>
    <button class="top-btn primary" id="btn-generate">▶ Generate Code</button>
  </div>
</div>

<!-- MAIN -->
<div id="main">
  <!-- LEFT PALETTE -->
  <div id="palette">
    <div id="palette-header">Blocks</div>
    <div id="palette-scroll" id="palette-list"></div>
  </div>

  <!-- CANVAS -->
  <div id="canvas-wrap">
    <div id="canvas-tools">
      <button class="ctool active" id="tool-select" title="Select (V)">↖</button>
      <button class="ctool" id="tool-pan" title="Pan (H)">✥</button>
      <button class="ctool" id="tool-del" title="Delete selected (Del)">🗑</button>
      <div style="width:1px;background:var(--border);margin:3px 2px"></div>
      <button class="ctool" id="tool-zoom-in" title="Zoom in">+</button>
      <button class="ctool" id="tool-zoom-out" title="Zoom out">−</button>
      <button class="ctool" id="tool-fit" title="Fit to screen">⊡</button>
    </div>
    <canvas id="main-canvas"></canvas>
  </div>

  <!-- RIGHT SIDEBAR -->
  <div id="sidebar">
    <div id="sidebar-header">
      <span id="sidebar-title">Variables</span>
    </div>
    <div id="sidebar-scroll">
      <div id="global-vars-section">
        <div class="var-section-title">Global <span style="color:var(--text3);font-weight:400">(main scope)</span></div>
        <div id="global-var-list"></div>
        <button class="add-var-btn" id="btn-add-global">+ Add Global Variable</button>
      </div>
      <div id="fn-vars-section" style="display:none">
        <div class="sidebar-divider"></div>
        <div class="var-section-title">
          Local
          <div class="toggle-pair">
            <button class="toggle-btn" id="toggle-params" title="Show as params">param</button>
            <button class="toggle-btn" id="toggle-returns" title="Show as returns">return</button>
          </div>
        </div>
        <div id="local-var-list"></div>
        <button class="add-var-btn" id="btn-add-local">+ Add Local Variable</button>
        <div class="sidebar-divider"></div>
        <div class="var-section-title">Parameters</div>
        <div id="param-list"></div>
        <button class="add-var-btn" id="btn-add-param">+ Add Parameter</button>
        <div class="sidebar-divider"></div>
        <div class="var-section-title">Return Values</div>
        <div id="return-list"></div>
        <button class="add-var-btn" id="btn-add-return">+ Add Return Value</button>
      </div>
    </div>
  </div>
</div>

<!-- CONTEXT MENU -->
<div id="ctx-menu">
  <div class="ctx-item" id="ctx-edit">✏️ Edit Block</div>
  <div class="ctx-item" id="ctx-dup">⧉ Duplicate</div>
  <div class="ctx-divider"></div>
  <div class="ctx-item danger" id="ctx-del">🗑 Delete</div>
</div>

<!-- TOOLTIP -->
<div id="tooltip"></div>

<!-- NEW FUNCTION MODAL -->
<div class="modal-overlay" id="fn-modal">
  <div class="modal">
    <h2>New Function</h2>
    <label>Function Name</label>
    <input type="text" id="fn-name-input" placeholder="my_function">
    <div class="modal-btns">
      <button class="modal-btn" id="fn-cancel">Cancel</button>
      <button class="modal-btn ok" id="fn-ok">Create</button>
    </div>
  </div>
</div>

<!-- EDIT BLOCK MODAL -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <h2 id="edit-modal-title">Edit Block</h2>
    <div id="edit-modal-body"></div>
    <div class="modal-btns">
      <button class="modal-btn" id="edit-cancel">Cancel</button>
      <button class="modal-btn ok" id="edit-ok">Apply</button>
    </div>
  </div>
</div>

<!-- CODE OUTPUT MODAL -->
<div class="modal-overlay" id="code-modal">
  <div class="modal" style="min-width:600px;max-height:80vh;display:flex;flex-direction:column">
    <h2>Generated MicroPython</h2>
    <pre id="code-out"></pre>
    <div class="modal-btns">
      <button class="modal-btn" id="btn-copy-code">📋 Copy</button>
      <button class="modal-btn" id="btn-dl-code">💾 Download</button>
      <button class="modal-btn ok" id="code-close">Close</button>
    </div>
  </div>
</div>

<!-- FILE INPUT (hidden) -->
<input type="file" id="file-input" style="display:none" accept=".py">

<script>
'use strict';

/* ═══════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════ */
const state = {
  tabs: [{ id: 0, name: 'main', isMain: true, blocks: [], connections: [], localVars: [], params: [], returns: [] }],
  activeTab: 0,
  nextTabId: 1,
  globalVars: [],  // {id, name, value}
  initCode: '',
  libCode: '',
  libBlocks: [],   // parsed from lib.py

  // canvas per-tab
  canvasState: { 0: { offsetX: 0, offsetY: 0, scale: 1 } },

  // interaction
  dragging: null,      // { block, startX, startY, offX, offY }
  connecting: null,    // { block, port, type }
  selected: null,
  tool: 'select',
  pan: { active: false, startX: 0, startY: 0, startOX: 0, startOY: 0 },
  nextBlockId: 1,
  nextVarId: 1,

  ctxTarget: null,   // block under right-click
};

/* ═══════════════════════════════════════════════
   BLOCK DEFINITIONS
═══════════════════════════════════════════════ */
const BLOCK_DEFS = {
  // FLOW
  start:      { label: 'START',         color: '#4af0b0', cat: 'flow',    flowIn: false, flowOut: true,  ports: { in:[], out:[] }, fields: [] },
  end_main:   { label: 'END',           color: '#4af0b0', cat: 'flow',    flowIn: true,  flowOut: false, ports: { in:[], out:[] }, fields: [] },
  comment:    { label: 'Comment',       color: '#5a6478', cat: 'flow',    flowIn: false, flowOut: false, ports: { in:[], out:[] }, fields: [{k:'text',label:'Text',type:'text',default:'comment'}] },
  // CONTROL
  if_block:   { label: 'IF',            color: '#ffc85a', cat: 'control', flowIn: true,  flowOut: true,  extraFlows:['false'], ports: { in:[{l:'cond'}], out:[] }, fields: [] },
  for_loop:   { label: 'FOR',           color: '#ffc85a', cat: 'control', flowIn: true,  flowOut: true,  extraFlows:['exit'], ports: { in:[{l:'iter'}], out:[] }, fields: [{k:'var',label:'Var',type:'text',default:'i'}] },
  while_loop: { label: 'WHILE',         color: '#ffc85a', cat: 'control', flowIn: true,  flowOut: true,  extraFlows:['exit'], ports: { in:[{l:'cond'}], out:[] }, fields: [] },

  set_var:    { label: 'Set Var',       color: '#c97bff', cat: 'value',   flowIn: true,  flowOut: true,  ports: { in:[{l:'val'}], out:[] }, fields: [{k:'name',label:'Variable',type:'text',default:'x'}] },
  data_blk:   { label: 'Data',          color: '#c97bff', cat: 'value',   flowIn: false, flowOut: false, ports: { in:[], out:[{l:'val'}] }, fields: [{k:'value',label:'Value',type:'text',default:'0'}] },

  op_add:     { label: 'ADD  (+)',      color: '#5b8fff', cat: 'op',      flowIn: false, flowOut: false, ports: { in:[{l:'a'},{l:'b'}], out:[{l:'res'}] }, fields: [] },
  op_sub:     { label: 'SUB  (−)',      color: '#5b8fff', cat: 'op',      flowIn: false, flowOut: false, ports: { in:[{l:'a'},{l:'b'}], out:[{l:'res'}] }, fields: [] },
  op_mul:     { label: 'MUL  (×)',      color: '#5b8fff', cat: 'op',      flowIn: false, flowOut: false, ports: { in:[{l:'a'},{l:'b'}], out:[{l:'res'}] }, fields: [] },
  op_div:     { label: 'DIV  (÷)',      color: '#5b8fff', cat: 'op',      flowIn: false, flowOut: false, ports: { in:[{l:'a'},{l:'b'}], out:[{l:'res'}] }, fields: [] },
  op_mod:     { label: 'MOD  (%)',      color: '#5b8fff', cat: 'op',      flowIn: false, flowOut: false, ports: { in:[{l:'a'},{l:'b'}], out:[{l:'res'}] }, fields: [] },
  op_eq:      { label: 'EQ   (==)',     color: '#5b8fff', cat: 'op',      flowIn: false, flowOut: false, ports: { in:[{l:'a'},{l:'b'}], out:[{l:'res'}] }, fields: [] },
  op_neq:     { label: 'NEQ  (!=)',     color: '#5b8fff', cat: 'op',      flowIn: false, flowOut: false, ports: { in:[{l:'a'},{l:'b'}], out:[{l:'res'}] }, fields: [] },
  op_lt:      { label: 'LT   (<)',      color: '#5b8fff', cat: 'op',      flowIn: false, flowOut: false, ports: { in:[{l:'a'},{l:'b'}], out:[{l:'res'}] }, fields: [] },
  op_gt:      { label: 'GT   (>)',      color: '#5b8fff', cat: 'op',      flowIn: false, flowOut: false, ports: { in:[{l:'a'},{l:'b'}], out:[{l:'res'}] }, fields: [] },
  op_and:     { label: 'AND',           color: '#5b8fff', cat: 'op',      flowIn: false, flowOut: false, ports: { in:[{l:'a'},{l:'b'}], out:[{l:'res'}] }, fields: [] },
  op_or:      { label: 'OR',            color: '#5b8fff', cat: 'op',      flowIn: false, flowOut: false, ports: { in:[{l:'a'},{l:'b'}], out:[{l:'res'}] }, fields: [] },
  op_not:     { label: 'NOT',           color: '#5b8fff', cat: 'op',      flowIn: false, flowOut: false, ports: { in:[{l:'a'}],        out:[{l:'res'}] }, fields: [] },
  // MISC
  delay:      { label: 'Delay',         color: '#ff9f43', cat: 'misc',    flowIn: true,  flowOut: true,  ports: { in:[{l:'ms'}], out:[] }, fields: [{k:'ms',label:'ms',type:'text',default:'1000'}] },
  print_blk:  { label: 'Print',         color: '#ff9f43', cat: 'misc',    flowIn: true,  flowOut: true,  ports: { in:[{l:'val'}], out:[] }, fields: [] },
  ret_block:  { label: 'Return',        color: '#ff6b6b', cat: 'func',    flowIn: true,  flowOut: false, ports: { in:[], out:[] }, fields: [] },
};

const PALETTE_GROUPS = [
  { title: 'Flow',     types: ['start','end_main','comment'] },
  { title: 'Control',  types: ['if_block','for_loop','while_loop','break_blk'] },
  { title: 'Values',   types: ['read_var','set_var','data_blk'] },
  { title: 'Operators',types: ['op_add','op_sub','op_mul','op_div','op_mod','op_eq','op_neq','op_lt','op_gt','op_and','op_or','op_not'] },
  { title: 'Misc',     types: ['delay','print_blk'] },
  { title: 'Functions',types: ['ret_block'] },
];

/* ═══════════════════════════════════════════════
   CANVAS ENGINE
═══════════════════════════════════════════════ */
const canvas = document.getElementById('main-canvas');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('canvas-wrap');

const BW = 160, BH_BASE = 56, PORT_R = 6, FLOW_R = 7;

function resize() {
  canvas.width = wrap.clientWidth;
  canvas.height = wrap.clientHeight;
  draw();
}
window.addEventListener('resize', resize);

function getCS() {
  if (!state.canvasState[state.activeTab])
    state.canvasState[state.activeTab] = { offsetX: 0, offsetY: 0, scale: 1 };
  return state.canvasState[state.activeTab];
}

function toWorld(sx, sy) {
  const cs = getCS();
  return { x: (sx - cs.offsetX) / cs.scale, y: (sy - cs.offsetY) / cs.scale };
}
function toScreen(wx, wy) {
  const cs = getCS();
  return { x: wx * cs.scale + cs.offsetX, y: wy * cs.scale + cs.offsetY };
}

function activeTab() { return state.tabs.find(t => t.id === state.activeTab); }
function activeBlocks() { return activeTab()?.blocks || []; }
function activeConns() { return activeTab()?.connections || []; }

/* ── block geometry ── */
function blockHeight(b) {
  const def = getBlockDef(b.type);
  const fields = def.fields || [];
  return BH_BASE + fields.length * 20 + (def.extraFlows ? def.extraFlows.length * 14 : 0);
}

function getBlockDef(type) {
  return BLOCK_DEFS[type] || state.libBlocks.find(lb => lb.type === type) || { label: type, color: '#888', cat: 'lib', flowIn: true, flowOut: true, ports: { in: [], out: [] }, fields: [] };
}

/* Port positions in world space */
function getPortPos(block, portType, idx) {
  const def = getBlockDef(block.type);
  const bh = blockHeight(block);
  // portType: 'flowIn','flowOut','flowExtra_N','dataIn_N','dataOut_N'
  if (portType === 'flowIn')  return { x: block.x + BW / 2, y: block.y };
  if (portType === 'flowOut') return { x: block.x + BW / 2, y: block.y + bh };
  if (portType.startsWith('flowExtra_')) {
    const ei = parseInt(portType.split('_')[1]);
    return { x: block.x + BW / 2 + (ei + 1) * 28, y: block.y + bh };
  }
  if (portType === 'dataIn')  {
    const total = (def.ports?.in || []).length;
    const step = BW / (total + 1);
    return { x: block.x + step * (idx + 1), y: block.y + bh / 2 + 8 };
  }
  if (portType === 'dataOut') {
    const total = (def.ports?.out || []).length;
    const step = BW / (total + 1);
    return { x: block.x + step * (idx + 1), y: block.y + bh / 2 + 8 };
  }
  return { x: block.x, y: block.y };
}

/* ── DRAW ── */
function draw() {
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  const cs = getCS();
  ctx.save();
  ctx.translate(cs.offsetX, cs.offsetY);
  ctx.scale(cs.scale, cs.scale);

  // Draw connections
  for (const conn of activeConns()) drawConnection(conn);

  // Draw pending connection
  if (state.connecting && state.connectingMouse) {
    const { block, portType } = state.connecting;
    const p = getPortPos(block, portType, state.connecting.idx || 0);
    const m = state.connectingMouse;
    drawBezier(p.x, p.y, m.x, m.y, state.connecting.isFlow ? '#5b8fff' : '#c97bff', 1.5);
  }

  // Draw blocks
  for (const block of activeBlocks()) drawBlock(block);

  ctx.restore();
}

function drawBlock(block) {
  const def = getBlockDef(block.type);
  const bh = blockHeight(block);
  const bw = BW;
  const selected = state.selected?.id === block.id;
  const cs = getCS();

  // Shadow
  ctx.shadowColor = selected ? def.color + '60' : 'rgba(0,0,0,0.4)';
  ctx.shadowBlur = selected ? 18 : 8;
  ctx.shadowOffsetY = 2;

  // Body
  roundRect(ctx, block.x, block.y, bw, bh, 8);
  ctx.fillStyle = '#1a1e28';
  ctx.fill();
  ctx.strokeStyle = selected ? def.color : '#2a3045';
  ctx.lineWidth = selected ? 2 : 1;
  ctx.stroke();

  ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

  // Color bar left
  roundRectLeft(ctx, block.x, block.y, 6, bh, 8);
  ctx.fillStyle = def.color;
  ctx.fill();

  // Label
  ctx.fillStyle = def.color;
  ctx.font = `600 11px 'Syne', sans-serif`;
  ctx.textBaseline = 'middle';
  ctx.fillText(def.label, block.x + 14, block.y + 16);

  // Fields
  let fy = block.y + 32;
  for (const field of (def.fields || [])) {
    const val = block.data?.[field.k] ?? field.default ?? '';
    ctx.fillStyle = '#5a6478';
    ctx.font = '9px JetBrains Mono';
    ctx.fillText(field.label + ':', block.x + 14, fy);
    ctx.fillStyle = '#e8eaf0';
    ctx.font = '10px JetBrains Mono';
    ctx.fillText(String(val).substring(0, 14), block.x + 52, fy);
    fy += 20;
  }

  // Flow in (top)
  if (def.flowIn !== false) {
    const p = getPortPos(block, 'flowIn', 0);
    drawFlowPort(p.x, p.y, def.color, true);
  }
  // Flow out (bottom)
  if (def.flowOut !== false) {
    const p = getPortPos(block, 'flowOut', 0);
    drawFlowPort(p.x, p.y, def.color, false);
    if (def.extraFlows) {
      for (let i = 0; i < def.extraFlows.length; i++) {
        const p2 = getPortPos(block, `flowExtra_${i}`, 0);
        drawFlowPort(p2.x, p2.y, '#ff9f43', false);
        ctx.fillStyle = '#ff9f43';
        ctx.font = '8px JetBrains Mono';
        ctx.textAlign = 'center';
        ctx.fillText(def.extraFlows[i], p2.x, p2.y + 16);
        ctx.textAlign = 'left';
      }
    }
  }

  // Data ports left (inputs)
  const dIn = def.ports?.in || [];
  for (let i = 0; i < dIn.length; i++) {
    const p = { x: block.x, y: block.y + bh / 2 + 8 + i * 16 - (dIn.length - 1) * 8 };
    drawDataPort(p.x, p.y, '#c97bff', true);
    ctx.fillStyle = '#8892aa';
    ctx.font = '9px JetBrains Mono';
    ctx.textBaseline = 'middle';
    ctx.fillText(dIn[i].l, block.x + 10, p.y);
  }

  // Data ports right (outputs)
  const dOut = def.ports?.out || [];
  for (let i = 0; i < dOut.length; i++) {
    const p = { x: block.x + bw, y: block.y + bh / 2 + 8 + i * 16 - (dOut.length - 1) * 8 };
    drawDataPort(p.x, p.y, '#c97bff', false);
    ctx.fillStyle = '#8892aa';
    ctx.font = '9px JetBrains Mono';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillText(dOut[i].l, block.x + bw - 10, p.y);
    ctx.textAlign = 'left';
  }

  // Function call blocks: extra label
  if (def.cat === 'call') {
    ctx.fillStyle = '#5b8fff';
    ctx.font = '10px JetBrains Mono';
    ctx.fillText('fn: ' + def.fnName, block.x + 14, block.y + bh - 14);
  }
}

function drawFlowPort(x, y, color, isIn) {
  ctx.beginPath();
  ctx.arc(x, y, FLOW_R, 0, Math.PI * 2);
  ctx.fillStyle = '#13161d';
  ctx.fill();
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.stroke();
  // Arrow hint
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, 3, 0, Math.PI * 2);
  ctx.fill();
}

function drawDataPort(x, y, color, isIn) {
  ctx.beginPath();
  ctx.rect(x - PORT_R, y - PORT_R, PORT_R * 2, PORT_R * 2);
  ctx.fillStyle = '#13161d';
  ctx.fill();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.rect(x - 2, y - 2, 4, 4);
  ctx.fill();
}

function drawConnection(conn) {
  const fromBlock = activeBlocks().find(b => b.id === conn.fromBlock);
  const toBlock   = activeBlocks().find(b => b.id === conn.toBlock);
  if (!fromBlock || !toBlock) return;
  const from = getPortPos(fromBlock, conn.fromPort, conn.fromIdx || 0);
  const to   = getPortPos(toBlock,   conn.toPort,   conn.toIdx   || 0);
  const isFlow = conn.fromPort.startsWith('flow') || conn.fromPort === 'flowOut';
  drawBezier(from.x, from.y, to.x, to.y, isFlow ? '#5b8fff80' : '#c97bff80', isFlow ? 2 : 1.5);
}

function drawBezier(x1, y1, x2, y2, color, lw) {
  const dy = y2 - y1;
  const cp = Math.max(40, Math.abs(dy) * 0.5);
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.bezierCurveTo(x1, y1 + cp, x2, y2 - cp, x2, y2);
  ctx.strokeStyle = color;
  ctx.lineWidth = lw;
  ctx.stroke();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

function roundRectLeft(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w, y);
  ctx.lineTo(x + w, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

/* ═══════════════════════════════════════════════
   HIT TESTING
═══════════════════════════════════════════════ */
function hitBlock(wx, wy) {
  const blocks = activeBlocks();
  for (let i = blocks.length - 1; i >= 0; i--) {
    const b = blocks[i];
    const bh = blockHeight(b);
    if (wx >= b.x && wx <= b.x + BW && wy >= b.y && wy <= b.y + bh) return b;
  }
  return null;
}

function hitPort(wx, wy, block) {
  const def = getBlockDef(block.type);
  const bh = blockHeight(block);
  const R = 12;

  if (def.flowIn !== false) {
    const p = getPortPos(block, 'flowIn', 0);
    if (Math.hypot(wx - p.x, wy - p.y) < R) return { portType: 'flowIn', idx: 0, isFlow: true };
  }
  if (def.flowOut !== false) {
    const p = getPortPos(block, 'flowOut', 0);
    if (Math.hypot(wx - p.x, wy - p.y) < R) return { portType: 'flowOut', idx: 0, isFlow: true };
    if (def.extraFlows) {
      for (let i = 0; i < def.extraFlows.length; i++) {
        const p2 = getPortPos(block, `flowExtra_${i}`, 0);
        if (Math.hypot(wx - p2.x, wy - p2.y) < R) return { portType: `flowExtra_${i}`, idx: 0, isFlow: true };
      }
    }
  }
  const dIn = def.ports?.in || [];
  for (let i = 0; i < dIn.length; i++) {
    const p = { x: block.x, y: block.y + bh / 2 + 8 + i * 16 - (dIn.length - 1) * 8 };
    if (Math.hypot(wx - p.x, wy - p.y) < R) return { portType: 'dataIn', idx: i, isFlow: false };
  }
  const dOut = def.ports?.out || [];
  for (let i = 0; i < dOut.length; i++) {
    const p = { x: block.x + BW, y: block.y + bh / 2 + 8 + i * 16 - (dOut.length - 1) * 8 };
    if (Math.hypot(wx - p.x, wy - p.y) < R) return { portType: 'dataOut', idx: i, isFlow: false };
  }
  return null;
}

/* ═══════════════════════════════════════════════
   MOUSE EVENTS
═══════════════════════════════════════════════ */
canvas.addEventListener('mousedown', e => {
  if (e.button === 2) return;
  const { x: wx, y: wy } = toWorld(e.offsetX, e.offsetY);
  hideCtx();

  if (state.tool === 'pan') {
    const cs = getCS();
    state.pan = { active: true, startX: e.clientX, startY: e.clientY, startOX: cs.offsetX, startOY: cs.offsetY };
    canvas.style.cursor = 'grabbing';
    return;
  }

  const block = hitBlock(wx, wy);
  if (block) {
    const port = hitPort(wx, wy, block);
    if (port) {
      state.connecting = { block, portType: port.portType, idx: port.idx, isFlow: port.isFlow };
      state.connectingMouse = { x: wx, y: wy };
      return;
    }
    state.selected = block;
    state.dragging = { block, offX: wx - block.x, offY: wy - block.y };
    // Bring to front
    const tab = activeTab();
    const i = tab.blocks.indexOf(block);
    tab.blocks.splice(i, 1);
    tab.blocks.push(block);
    draw();
    return;
  }

  state.selected = null;
  const cs = getCS();
  state.pan = { active: true, startX: e.clientX, startY: e.clientY, startOX: cs.offsetX, startOY: cs.offsetY };
  draw();
});

canvas.addEventListener('mousemove', e => {
  const { x: wx, y: wy } = toWorld(e.offsetX, e.offsetY);

  if (state.pan.active) {
    const cs = getCS();
    cs.offsetX = state.pan.startOX + (e.clientX - state.pan.startX);
    cs.offsetY = state.pan.startOY + (e.clientY - state.pan.startY);
    draw();
    return;
  }
  if (state.dragging) {
    const { block, offX, offY } = state.dragging;
    block.x = wx - offX;
    block.y = wy - offY;
    draw();
    return;
  }
  if (state.connecting) {
    state.connectingMouse = { x: wx, y: wy };
    draw();
    return;
  }

  // Hover cursor
  const block = hitBlock(wx, wy);
  if (block) {
    const port = hitPort(wx, wy, block);
    canvas.style.cursor = port ? 'crosshair' : 'grab';
  } else {
    canvas.style.cursor = state.tool === 'pan' ? 'grab' : 'default';
  }
});

canvas.addEventListener('mouseup', e => {
  const { x: wx, y: wy } = toWorld(e.offsetX, e.offsetY);

  if (state.pan.active) {
    state.pan.active = false;
    canvas.style.cursor = state.tool === 'pan' ? 'grab' : 'default';
  }

  if (state.connecting) {
    const fromBlock = state.connecting.block;
    const fromPort  = state.connecting.portType;
    const fromIdx   = state.connecting.idx;
    const block = hitBlock(wx, wy);
    if (block && block !== fromBlock) {
      const port = hitPort(wx, wy, block);
      if (port) {
        // validate: flow→flow, data→data
        const sameKind = state.connecting.isFlow === port.isFlow;
        // output→input direction
        const fromIsOut = fromPort.startsWith('flowOut') || fromPort.startsWith('flowExtra') || fromPort === 'dataOut';
        const toIsIn    = port.portType === 'flowIn' || port.portType === 'dataIn';
        if (sameKind && fromIsOut && toIsIn) {
          activeConns().push({
            id: state.nextBlockId++,
            fromBlock: fromBlock.id, fromPort, fromIdx,
            toBlock: block.id, toPort: port.portType, toIdx: port.idx
          });
        }
      }
    }
    state.connecting = null;
    state.connectingMouse = null;
    draw();
    return;
  }

  if (state.dragging) {
    state.dragging = null;
    canvas.style.cursor = 'default';
  }
});

canvas.addEventListener('dblclick', e => {
  const { x: wx, y: wy } = toWorld(e.offsetX, e.offsetY);
  const block = hitBlock(wx, wy);
  if (block) openEditModal(block);
});

canvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  const { x: wx, y: wy } = toWorld(e.offsetX, e.offsetY);
  const block = hitBlock(wx, wy);
  if (block) {
    state.ctxTarget = block;
    state.selected = block;
    showCtx(e.clientX, e.clientY);
    draw();
  }
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const cs = getCS();
  const factor = e.deltaY < 0 ? 1.1 : 0.9;
  const newScale = Math.min(3, Math.max(0.2, cs.scale * factor));
  const mx = e.offsetX, my = e.offsetY;
  cs.offsetX = mx - (mx - cs.offsetX) * (newScale / cs.scale);
  cs.offsetY = my - (my - cs.offsetY) * (newScale / cs.scale);
  cs.scale = newScale;
  draw();
}, { passive: false });

/* ═══════════════════════════════════════════════
   DROP FROM PALETTE
═══════════════════════════════════════════════ */
let dragPaletteType = null;

document.getElementById('palette-scroll').addEventListener('dragstart', e => {
  const el = e.target.closest('.palette-block');
  if (el) dragPaletteType = el.dataset.type;
});

wrap.addEventListener('dragover', e => { e.preventDefault(); });

wrap.addEventListener('drop', e => {
  e.preventDefault();
  if (!dragPaletteType) return;
  const rect = canvas.getBoundingClientRect();
  const { x: wx, y: wy } = toWorld(e.clientX - rect.left, e.clientY - rect.top);
  addBlock(dragPaletteType, wx - BW / 2, wy - 30);
  dragPaletteType = null;
});

function addBlock(type, x, y) {
  const def = getBlockDef(type);
  const block = {
    id: state.nextBlockId++,
    type,
    x, y,
    data: {}
  };
  for (const f of (def.fields || [])) block.data[f.k] = f.default ?? '';
  activeBlocks().push(block);
  state.selected = block;
  draw();
  return block;
}

/* ═══════════════════════════════════════════════
   PALETTE BUILD
═══════════════════════════════════════════════ */
function buildPalette() {
  const scroll = document.getElementById('palette-scroll');
  scroll.innerHTML = '';

  const groups = [...PALETTE_GROUPS];

  // Add function call blocks
  const fnTabs = state.tabs.filter(t => !t.isMain);
  if (fnTabs.length > 0) {
    groups.push({ title: 'Calls', types: fnTabs.map(t => 'call_fn_' + t.id) });
    for (const ft of fnTabs) {
      const key = 'call_fn_' + ft.id;
      if (!BLOCK_DEFS[key]) {
        BLOCK_DEFS[key] = {
          label: ft.name + '()',
          color: '#4af0b0',
          cat: 'call', fnName: ft.name, fnTab: ft.id,
          flowIn: true, flowOut: true,
          ports: {
            in:  ft.params.map(p => ({ l: p.name })),
            out: ft.returns.map(r => ({ l: r.name }))
          },
          fields: []
        };
      } else {
        // Update ports from tab definition
        BLOCK_DEFS[key].ports = {
          in:  ft.params.map(p => ({ l: p.name })),
          out: ft.returns.map(r => ({ l: r.name }))
        };
      }
    }
  }

  // Lib blocks
  if (state.libBlocks.length > 0) {
    groups.push({ title: 'Library', types: state.libBlocks.map(b => b.type) });
  }

  for (const grp of groups) {
    const g = document.createElement('div');
    g.className = 'palette-group';
    g.innerHTML = `<div class="palette-group-title">${grp.title}</div>`;
    for (const type of grp.types) {
      const def = getBlockDef(type);
      const el = document.createElement('div');
      el.className = 'palette-block';
      el.draggable = true;
      el.dataset.type = type;
      el.innerHTML = `
        <div class="pb-color" style="background:${def.color}"></div>
        <div class="pb-info">
          <div class="pb-name">${def.label}</div>
          <div class="pb-desc">${def.cat}</div>
        </div>`;
      g.appendChild(el);
    }
    scroll.appendChild(g);
  }
}

/* ═══════════════════════════════════════════════
   TABS
═══════════════════════════════════════════════ */
function buildTabs() {
  const bar = document.getElementById('topbar');
  // remove old tabs
  bar.querySelectorAll('.tab').forEach(e => e.remove());

  const btnNew = document.getElementById('btn-new-tab');
  for (const tab of state.tabs) {
    const el = document.createElement('div');
    el.className = 'tab' + (tab.id === state.activeTab ? ' active' : '');
    el.dataset.tabId = tab.id;
    el.innerHTML = `<span class="tab-icon">${tab.isMain ? '⬡' : 'ƒ'}</span>
      <span class="tab-name">${tab.name}</span>
      ${!tab.isMain ? '<span class="tab-close" data-close="'+tab.id+'">×</span>' : ''}`;
    el.addEventListener('click', e => {
      if (e.target.dataset.close) { removeTab(parseInt(e.target.dataset.close)); return; }
      switchTab(tab.id);
    });
    bar.insertBefore(el, btnNew);
  }
}

function switchTab(id) {
  state.activeTab = id;
  buildTabs();
  buildSidebar();
  buildPalette();
  draw();
}

function removeTab(id) {
  const i = state.tabs.findIndex(t => t.id === id);
  if (i < 0) return;
  state.tabs.splice(i, 1);
  delete state.canvasState[id];
  const key = 'call_fn_' + id;
  delete BLOCK_DEFS[key];
  if (state.activeTab === id) {
    state.activeTab = state.tabs[0].id;
  }
  buildTabs();
  buildSidebar();
  buildPalette();
  draw();
}

document.getElementById('btn-new-tab').addEventListener('click', () => {
  showFnModal();
});

function showFnModal() {
  document.getElementById('fn-name-input').value = 'my_func';
  document.getElementById('fn-modal').classList.add('show');
  document.getElementById('fn-name-input').focus();
  document.getElementById('fn-name-input').select();
}

document.getElementById('fn-cancel').addEventListener('click', () => {
  document.getElementById('fn-modal').classList.remove('show');
});

document.getElementById('fn-ok').addEventListener('click', () => {
  const name = document.getElementById('fn-name-input').value.trim() || 'func';
  const id = state.nextTabId++;
  state.tabs.push({ id, name, isMain: false, blocks: [], connections: [], localVars: [], params: [], returns: [] });
  state.canvasState[id] = { offsetX: 0, offsetY: 0, scale: 1 };
  document.getElementById('fn-modal').classList.remove('show');
  switchTab(id);
});

/* ═══════════════════════════════════════════════
   SIDEBAR — VARIABLES
═══════════════════════════════════════════════ */
function buildSidebar() {
  const tab = activeTab();
  const isMain = tab?.isMain;
  document.getElementById('fn-vars-section').style.display = isMain ? 'none' : '';
  document.getElementById('global-vars-section').style.display = '';

  renderVarList('global-var-list', state.globalVars, 'global');
  if (!isMain && tab) {
    renderVarList('local-var-list',  tab.localVars, 'local');
    renderVarList('param-list',      tab.params,    'param');
    renderVarList('return-list',     tab.returns,   'return');
  }
}

function renderVarList(containerId, list, kind) {
  const container = document.getElementById(containerId);
  if (!container) return;
  container.innerHTML = '';
  for (const v of list) {
    const el = document.createElement('div');
    el.className = 'var-item';
    el.dataset.id = v.id;
    el.draggable = true;
    el.innerHTML = `
      <span class="drag-handle">⠿</span>
      <input type="text" placeholder="name" value="${v.name}" data-field="name" data-id="${v.id}" data-kind="${kind}">
      ${kind === 'global' || kind === 'local' ? `<input type="text" placeholder="None" value="${v.value||''}" data-field="value" data-id="${v.id}" data-kind="${kind}" style="width:60px;color:var(--accent4)">` : ''}
      <span class="var-del" data-del="${v.id}" data-kind="${kind}">×</span>`;
    container.appendChild(el);
  }

  // Input changes
  container.querySelectorAll('input[data-field]').forEach(inp => {
    inp.addEventListener('change', () => {
      const { id, field, kind } = inp.dataset;
      const v = getVarById(parseInt(id), kind);
      if (v) v[field] = inp.value;
      buildPalette(); // refresh fn block ports
      draw();
    });
  });

  // Delete
  container.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', () => {
      const { del: id, kind } = btn.dataset;
      removeVar(parseInt(id), kind);
    });
  });

  // Drag-reorder
  setupVarDrag(container, list);
}

function setupVarDrag(container, list) {
  let dragFrom = null;
  container.querySelectorAll('.var-item').forEach(el => {
    el.addEventListener('dragstart', e => { dragFrom = parseInt(el.dataset.id); e.stopPropagation(); });
    el.addEventListener('dragover', e => { e.preventDefault(); });
    el.addEventListener('drop', e => {
      e.stopPropagation();
      const dragTo = parseInt(el.dataset.id);
      if (dragFrom === dragTo) return;
      const fi = list.findIndex(v => v.id === dragFrom);
      const ti = list.findIndex(v => v.id === dragTo);
      const [item] = list.splice(fi, 1);
      list.splice(ti, 0, item);
      buildSidebar();
    });
  });
}

function getVarById(id, kind) {
  if (kind === 'global') return state.globalVars.find(v => v.id === id);
  const tab = activeTab();
  if (!tab) return null;
  if (kind === 'local')  return tab.localVars.find(v => v.id === id);
  if (kind === 'param')  return tab.params.find(v => v.id === id);
  if (kind === 'return') return tab.returns.find(v => v.id === id);
}

function removeVar(id, kind) {
  const listMap = { global: state.globalVars, local: activeTab()?.localVars, param: activeTab()?.params, return: activeTab()?.returns };
  const list = listMap[kind];
  if (!list) return;
  const i = list.findIndex(v => v.id === id);
  if (i >= 0) list.splice(i, 1);
  buildSidebar();
  buildPalette();
}

function addVar(kind) {
  const v = { id: state.nextVarId++, name: kind === 'param' ? 'arg' : kind === 'return' ? 'ret' : 'var', value: '' };
  if (kind === 'global') state.globalVars.push(v);
  else {
    const tab = activeTab();
    if (!tab) return;
    if (kind === 'local')  tab.localVars.push(v);
    if (kind === 'param')  tab.params.push(v);
    if (kind === 'return') tab.returns.push(v);
  }
  buildSidebar();
  buildPalette();
}

document.getElementById('btn-add-global').addEventListener('click', () => addVar('global'));
document.getElementById('btn-add-local')?.addEventListener('click',  () => addVar('local'));
document.getElementById('btn-add-param')?.addEventListener('click',  () => addVar('param'));
document.getElementById('btn-add-return')?.addEventListener('click', () => addVar('return'));

document.getElementById('tool-fit').addEventListener('click', () => {
  const blocks = activeBlocks();
  if (!blocks.length) { getCS().offsetX = 0; getCS().offsetY = 0; getCS().scale = 1; draw(); return; }
  const xs = blocks.map(b => b.x); const ys = blocks.map(b => b.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs) + BW;
  const minY = Math.min(...ys), maxY = Math.max(...ys) + 80;
  const pad = 60;
  const scaleX = (canvas.width - pad * 2) / (maxX - minX || 1);
  const scaleY = (canvas.height - pad * 2) / (maxY - minY || 1);
  const cs = getCS();
  cs.scale = Math.min(2, Math.min(scaleX, scaleY));
  cs.offsetX = canvas.width / 2 - ((minX + maxX) / 2) * cs.scale;
  cs.offsetY = canvas.height / 2 - ((minY + maxY) / 2) * cs.scale;
  draw();
});

fileInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const content = ev.target.result;
    if (fileTarget === 'init') { state.initCode = content; alert('init.py loaded ✓'); }
    if (fileTarget === 'lib')  { state.libCode = content; parseLib(content); buildPalette(); alert('lib.py loaded — ' + state.libBlocks.length + ' functions found.'); }
  };
  reader.readAsText(file);
  fileInput.value = '';
});

function parseLib(code) {
  state.libBlocks = [];
  const re = /^def\s+(\w+)\s*\(([^)]*)\)/gm;
  let m;
  while ((m = re.exec(code)) !== null) {
    const name = m[1];
    const args = m[2].split(',').map(a => a.trim()).filter(Boolean);
    const type = 'lib_' + name;
    const def = {
      type, label: name + '()', color: '#ff9f43', cat: 'lib',
      flowIn: true, flowOut: true,
      ports: { in: args.map(a => ({ l: a.split('=')[0].trim() })), out: [{ l: 'ret' }] },
      fields: []
    };
    BLOCK_DEFS[type] = def;
    state.libBlocks.push(def);
  }
}

/* ═══════════════════════════════════════════════
   CODE GENERATION
═══════════════════════════════════════════════ */
document.getElementById('btn-generate').addEventListener('click', generateCode);

function generateCode() {
  let code = '';
  const ind = (n) => '    '.repeat(n);

  // init.py content
  if (state.initCode.trim()) {
    code += '# === init.py ===\n' + state.initCode.trim() + '\n\n';
  }
  // lib.py content
  if (state.libCode.trim()) {
    code += '# === lib.py ===\n' + state.libCode.trim() + '\n\n';
  }

  // Global variables
  if (state.globalVars.length) {
    code += '# === Global Variables ===\n';
    for (const v of state.globalVars) {
      const val = v.value.trim() || 'None';
      code += `${v.name} = ${val}\n`;
    }
    code += '\n';
  }

  // Functions
  const fnTabs = state.tabs.filter(t => !t.isMain);
  for (const ft of fnTabs) {
    const params = ft.params.map(p => p.name).join(', ');
    code += `def ${ft.name}(${params}):\n`;
    if (ft.localVars.length) {
      for (const lv of ft.localVars) {
        code += ind(1) + `${lv.name} = ${lv.value || 'None'}\n`;
      }
    }
    code += generateFlowCode(ft, 1);
    if (ft.returns.length) {
      code += ind(1) + `return ${ft.returns.map(r => r.name).join(', ')}\n`;
    }
    code += '\n';
  }

  // Main
  const mainTab = state.tabs.find(t => t.isMain);
  code += '# === Main Program ===\n';
  code += generateFlowCode(mainTab, 0);

  document.getElementById('code-out').textContent = code;
  document.getElementById('code-modal').classList.add('show');
}

function generateFlowCode(tab, indentLevel) {
  const blocks = tab.blocks;
  const conns  = tab.connections;
  let code = '';
  const ind = (n) => '    '.repeat(n);

  // Find start block or topmost flow block
  const startBlock = blocks.find(b => b.type === 'start') || blocks.find(b => {
    const def = getBlockDef(b.type);
    return def.flowIn === false && def.flowOut !== false;
  });

  const visited = new Set();

  function followFlow(block, depth) {
    if (!block || visited.has(block.id)) return;
    visited.add(block.id);
    const def = getBlockDef(block.type);
    const il = indentLevel + depth;

    switch (block.type) {
      case 'start': break;
      case 'end_main': break;
      case 'comment':
        code += ind(il) + `# ${block.data?.text || ''}\n`;
        break;
      case 'set_var':
        code += ind(il) + `${block.data?.name || 'var'} = ${getDataInput(block, 0, conns, blocks)}\n`;
        break;
      case 'print_blk':
        code += ind(il) + `print(${getDataInput(block, 0, conns, blocks)})\n`;
        break;
      case 'delay':
        code += ind(il) + `time.sleep_ms(${block.data?.ms || getDataInput(block, 0, conns, blocks)})\n`;
        break;
      case 'if_block': {
        const cond = getDataInput(block, 0, conns, blocks);
        code += ind(il) + `if ${cond}:\n`;
        // true branch (flowOut)
        const trueNext = getFlowNext(block, 'flowOut', conns, blocks);
        if (trueNext) followFlow(trueNext, depth + 1);
        else code += ind(il + 1) + 'pass\n';
        // false branch (flowExtra_0)
        const falseNext = getFlowNext(block, 'flowExtra_0', conns, blocks);
        if (falseNext) {
          code += ind(il) + `else:\n`;
          followFlow(falseNext, depth + 1);
        }
        return; // flow exits from within branches
      }
      case 'for_loop': {
        const iter = getDataInput(block, 0, conns, blocks);
        const varName = block.data?.var || 'i';
        code += ind(il) + `for ${varName} in ${iter}:\n`;
        const bodyNext = getFlowNext(block, 'flowOut', conns, blocks);
        if (bodyNext) followFlow(bodyNext, depth + 1);
        else code += ind(il + 1) + 'pass\n';
        // exit path continues after loop
        const exitNext = getFlowNext(block, 'flowExtra_0', conns, blocks);
        if (exitNext) followFlow(exitNext, depth);
        return;
      }
      case 'while_loop': {
        const cond = getDataInput(block, 0, conns, blocks);
        code += ind(il) + `while ${cond}:\n`;
        const bodyNext = getFlowNext(block, 'flowOut', conns, blocks);
        if (bodyNext) followFlow(bodyNext, depth + 1);
        else code += ind(il + 1) + 'pass\n';
        const exitNext = getFlowNext(block, 'flowExtra_0', conns, blocks);
        if (exitNext) followFlow(exitNext, depth);
        return;
      }
      case 'break_blk':
        code += ind(il) + 'break\n';
        return;
      case 'ret_block':
        code += ind(il) + `return\n`;
        return;
      default:
        if (def.cat === 'call') {
          const fnTab = state.tabs.find(t => t.id === def.fnTab);
          if (fnTab) {
            const args = fnTab.params.map((p, i) => getDataInput(block, i, conns, blocks)).join(', ');
            const rets = fnTab.returns.map(r => r.name);
            const lhs = rets.length ? rets.join(', ') + ' = ' : '';
            code += ind(il) + `${lhs}${fnTab.name}(${args})\n`;
          }
        } else if (def.cat === 'lib') {
          const args = (def.ports.in || []).map((p, i) => getDataInput(block, i, conns, blocks)).join(', ');
          code += ind(il) + `${def.label.replace('()', '')}(${args})\n`;
        }
    }

    // Continue flow
    if (def.flowOut !== false && block.type !== 'if_block' && block.type !== 'for_loop' && block.type !== 'while_loop') {
      const next = getFlowNext(block, 'flowOut', conns, blocks);
      if (next) followFlow(next, depth);
    }
  }

  followFlow(startBlock, 0);

  // Emit unvisited blocks with flow that weren't connected
  for (const b of blocks) {
    if (!visited.has(b.id)) {
      const def = getBlockDef(b.type);
      if (def.flowIn !== false || def.flowOut !== false) {
        code += ind(indentLevel) + `# [unconnected block: ${def.label}]\n`;
      }
    }
  }

  if (!code.trim()) code = ind(indentLevel) + 'pass\n';
  return code;
}

function getFlowNext(block, portType, conns, blocks) {
  const conn = conns.find(c => c.fromBlock === block.id && c.fromPort === portType);
  if (!conn) return null;
  return blocks.find(b => b.id === conn.toBlock);
}

function getDataInput(block, idx, conns, blocks) {
  const conn = conns.find(c => c.toBlock === block.id && c.toPort === 'dataIn' && c.toIdx === idx);
  if (!conn) return '_';
  const src = blocks.find(b => b.id === conn.fromBlock);
  if (!src) return '_';
  const def = getBlockDef(src.type);
  if (src.type === 'data_blk')  return src.data?.value || '0';
  if (src.type === 'read_var')  return src.data?.name  || 'var';
  if (src.type.startsWith('op_')) return resolveOp(src, conns, blocks);
  return src.data?.name || '_';
}

function resolveOp(block, conns, blocks) {
  const a = getDataInput(block, 0, conns, blocks);
  const b = getDataInput(block, 1, conns, blocks);
  const ops = { op_add:'+'  , op_sub:'-'  , op_mul:'*'  , op_div:'/'  , op_mod:'%',
                op_eq:'=='  , op_neq:'!=' , op_lt:'<'   , op_gt:'>'   ,
                op_and:'and', op_or:'or'  , op_not:'not ' };
  const op = ops[block.type] || '?';
  if (block.type === 'op_not') return `not ${a}`;
  return `(${a} ${op} ${b})`;
}

});

/* Enter key in fn modal */
document.getElementById('fn-name-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('fn-ok').click();
  if (e.key === 'Escape') document.getElementById('fn-cancel').click();
});

/* ═══════════════════════════════════════════════
   INIT — add a default start block
═══════════════════════════════════════════════ */
function init() {
  resize();
  buildPalette();
  buildSidebar();
  buildTabs();

  // Add START and END to main tab
  const tab = state.tabs[0];
  const start = { id: state.nextBlockId++, type: 'start', x: 200, y: 80, data: {} };
  const end   = { id: state.nextBlockId++, type: 'end_main', x: 200, y: 260, data: {} };
  tab.blocks.push(start, end);

  // Center
  const cs = getCS();
  cs.offsetX = wrap.clientWidth / 2 - (200 + BW / 2) * cs.scale;
  cs.offsetY = 40;

  draw();
}

init();
</script>
