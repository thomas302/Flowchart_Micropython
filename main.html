<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowScript — MicroPython Visual IDE</title>
<link rel="stylesheet" href="main.css">
</head>
<body>
<div id="topbar">
  <div id="btn-new-tab" title="New Function">+</div>
  <div id="topbar-right">
    <button class="top-btn" id="btn-load-lib">📂 Load lib.py</button>
    <button class="top-btn" id="btn-load-init">📂 Load init.py</button>
    <div style="width:1px;background:var(--border);margin:6px 2px"></div>
    <button class="top-btn" id="btn-save-chart">💾 Save Chart</button>
    <button class="top-btn" id="btn-load-chart">📂 Load Chart</button>
    <button class="top-btn primary" id="btn-generate">▶ Generate Code</button>
  </div>
</div>
<div id="main">
  <div id="palette">
    <div id="palette-header">Blocks</div>
    <div id="palette-scroll"></div>
  </div>
  <div id="canvas-wrap">
    <!-- Loop context banner -->
    <div id="loop-context-bar">
      <span class="lcb-icon">⟳</span>
      <span id="loop-context-label">Loop body</span>
    </div>
    <div id="canvas-tools">
      <button class="ctool active" id="tool-select" title="Select">↖</button>
      <button class="ctool" id="tool-pan" title="Pan">✥</button>
      <button class="ctool" id="tool-del" title="Delete (Del)">🗑</button>
      <div style="width:1px;background:var(--border);margin:3px 2px"></div>
      <button class="ctool" id="tool-zoom-in" title="Zoom in">+</button>
      <button class="ctool" id="tool-zoom-out" title="Zoom out">−</button>
      <button class="ctool" id="tool-fit" title="Fit">⊡</button>
    </div>
    <canvas id="main-canvas"></canvas>
  </div>
  <div id="sidebar">
    <div id="sidebar-header"><span id="sidebar-title">Variables</span></div>
    <div id="sidebar-scroll">
      <div id="global-vars-section">
        <div class="var-section-title">Global</div>
        <div id="global-var-list"></div>
        <button class="add-var-btn" id="btn-add-global">+ Add Global</button>
      </div>
      <div id="loop-hint-section" style="display:none">
        <div class="loop-hint">
          <strong>Loop body canvas</strong>
          Connect <em>LOOP START</em> → your blocks → <em>LOOP END</em>. Use BREAK to exit early.
        </div>
      </div>
      <div id="fn-vars-section" style="display:none">
        <div class="sidebar-divider"></div>
        <div class="var-section-title">Local</div>
        <div id="local-var-list"></div>
        <button class="add-var-btn" id="btn-add-local">+ Add Local</button>
        <div class="sidebar-divider"></div>
        <div class="var-section-title">Parameters</div>
        <div id="param-list"></div>
        <button class="add-var-btn" id="btn-add-param">+ Add Parameter</button>
        <div class="sidebar-divider"></div>
        <div class="var-section-title">Return Values</div>
        <div id="return-list"></div>
        <button class="add-var-btn" id="btn-add-return">+ Add Return</button>
      </div>
    </div>
  </div>
</div>

<!-- CTX MENU -->
<div id="ctx-menu">
  <div class="ctx-item loop-action" id="ctx-open-loop" style="display:none">⟳ Open Loop Body</div>
  <div class="ctx-divider" id="ctx-loop-divider" style="display:none"></div>
  <div class="ctx-item" id="ctx-edit">✏️ Edit Block</div>
  <div class="ctx-item" id="ctx-dup">⧉ Duplicate</div>
  <div class="ctx-divider"></div>
  <div class="ctx-item danger" id="ctx-del">🗑 Delete</div>
</div>

<!-- NEW FUNCTION MODAL -->
<div class="modal-overlay" id="fn-modal">
  <div class="modal">
    <h2>New Function</h2>
    <label>Function Name</label>
    <input type="text" id="fn-name-input" placeholder="my_function">
    <div class="modal-btns">
      <button class="modal-btn" id="fn-cancel">Cancel</button>
      <button class="modal-btn ok" id="fn-ok">Create</button>
    </div>
  </div>
</div>

<!-- EDIT BLOCK MODAL -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <h2 id="edit-modal-title">Edit Block</h2>
    <div id="edit-modal-body"></div>
    <div class="modal-btns">
      <button class="modal-btn" id="edit-cancel">Cancel</button>
      <button class="modal-btn ok" id="edit-ok">Apply</button>
    </div>
  </div>
</div>

<!-- CODE OUTPUT MODAL -->
<div class="modal-overlay" id="code-modal">
  <div class="modal" style="min-width:620px;max-height:80vh;display:flex;flex-direction:column">
    <h2>Generated MicroPython</h2>
    <pre id="code-out"></pre>
    <div class="modal-btns">
      <button class="modal-btn" id="btn-copy-code">📋 Copy</button>
      <button class="modal-btn" id="btn-dl-code">💾 Download</button>
      <button class="modal-btn ok" id="code-close">Close</button>
    </div>
  </div>
</div>

<input type="file" id="file-input" style="display:none" accept=".py">
<input type="file" id="chart-input" style="display:none" accept=".flowscript,.json">

<script src="main.js"></script>
</body>
